<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>NG Nail Art Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Abhaya+Libre:wght@400;500;600&family=Pinyon+Script&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  html,body{height:100%;margin:0;}
  ::-webkit-scrollbar{display:none;}
  body{
    --bg:#FFF7EF; --surface:#FFFFFF; --text:#111111; --muted:#6F6A66;
    --accent:#111111; --onAccent:#FFF7EF; --tint:#F6ECE2; --hairline:#E9E0D6;
    background:var(--bg); font-family:Montserrat,sans-serif; font-weight:300; letter-spacing:.02em; color:var(--text);
  }
  .tap{transition:transform .12s ease, opacity .12s ease;}
  .tap:active{transform:scale(.96); opacity:.85;}
  .card{background:var(--surface); border-radius:18px; padding:18px; border:1px solid var(--hairline); margin-bottom:12px;}
  .eyebrow{font-family:Montserrat,sans-serif; font-size:9.5px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.28em;}
  .title{font-family:Montserrat,sans-serif; font-size:15px; font-weight:400; color:var(--text); margin-top:6px; text-transform:uppercase; letter-spacing:.22em;}
  .pill{padding:6px 12px; border-radius:999px; font-family:Montserrat,sans-serif; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--hairline); background:transparent; color:var(--text);}
  .pill.active{background:var(--accent); color:var(--onAccent); border-color:var(--accent);}
  .stat{flex:1; text-align:center; background:var(--tint); border-radius:12px; padding:10px 6px;}
  .stat .num{font-family:Montserrat,sans-serif; font-size:16px; font-weight:700; color:var(--accent);}
  .stat .label{font-family:Montserrat,sans-serif; font-size:10px; color:var(--muted); margin-top:2px;}
  .toggle{width:38px; height:22px; border-radius:999px; background:var(--hairline); position:relative; cursor:pointer; flex-shrink:0;}
  .toggle.on{background:var(--accent);}
  .toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s ease;}
  .toggle.on .knob{left:18px;}
  .tag{font-family:Montserrat,sans-serif; font-size:9.5px; letter-spacing:.08em; padding:3px 9px; border-radius:999px; background:var(--tint); color:var(--text);}
  .topnav{position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--hairline); padding:10px 16px; display:flex; gap:6px; overflow-x:auto;}
  .navbtn{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 10px; border-radius:12px; font-family:Montserrat,sans-serif; font-size:10px; color:var(--muted); background:none; border:none; cursor:pointer; white-space:nowrap;}
  .navbtn.active{color:var(--accent); background:var(--tint);}
  .page{max-width:420px; margin:0 auto; padding:12px 16px 40px;}
  .section-hidden{display:none;}
  .avatar{width:40px; height:40px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:Montserrat,sans-serif; font-weight:600; font-size:15px; flex-shrink:0;}
  .row{display:flex; align-items:center; gap:10px;}
  .btn-primary{background:var(--accent); color:var(--onAccent); border:none; border-radius:10px; padding:9px 14px; font-family:Montserrat,sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;}
  .btn-ghost{background:transparent; border:1px solid var(--hairline); border-radius:10px; padding:9px 14px; font-family:Montserrat,sans-serif; font-weight:600; font-size:12.5px; cursor:pointer; color:var(--text);}
  .themeRow{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.active{border-color:var(--text);}
  input,textarea,select{width:100%; font-family:Montserrat,sans-serif; font-size:13px; padding:9px 11px; border-radius:10px; border:1px solid var(--hairline); background:var(--surface); color:var(--text);}
  .divider{height:1px; background:var(--hairline); margin:10px 0;}
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .loginCard{max-width:340px; width:100%; background:var(--surface); border-radius:20px; padding:28px 22px; box-shadow:0 4px 16px rgba(42,22,32,0.1);}
  .pwWrap{position:relative;}
  .pwWrap .eye{position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:15px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginCard">
    <div style="font-family:Montserrat,sans-serif; font-size:18px; font-weight:300; letter-spacing:.35em; text-transform:uppercase; text-align:center; margin-bottom:6px;">NG Nailart</div>
    <div style="text-align:center; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:22px;">Nail Art Dashboard</div>
    <div style="display:grid; gap:10px;">
      <input id="loginUser" placeholder="Username" autocomplete="username" />
      <div class="pwWrap">
        <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" style="padding-right:38px;" />
        <span class="eye tap" id="loginPwToggle">👁️</span>
      </div>
      <div id="loginError" style="font-size:11.5px; color:#C74A3E; display:none;">Username or password not recognized.</div>
      <button class="btn-primary tap" id="loginBtn" style="width:100%; margin-top:6px;">Log in</button>
    </div>
    <div style="font-size:10.5px; color:var(--muted); text-align:center; margin-top:16px;">Forgot your password? Ask the owner to reset it in Admin.</div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<div class="topnav" id="topnav"></div>
<div style="display:flex; justify-content:flex-end; padding:6px 16px 0;">
  <button id="changePwBtn" class="pill tap" style="font-size:10.5px; padding:5px 10px; margin-right:6px;">🔑 Password</button>
  <button id="logoutBtn" class="pill tap" style="font-size:10.5px; padding:5px 10px; margin-right:6px;">Log out</button>
  <button id="langToggle" class="pill tap" style="font-size:10.5px; padding:5px 10px;">🌐 EN / ID</button>
</div>
<div class="page" id="pages"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ---------- SUPABASE ----------
const SUPABASE_URL = 'https://avetybynptepfqmxedfj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2ZXR5YnlucHRlcGZxbXhlZGZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTA4NjEsImV4cCI6MjEwMzMyNjg2MX0.PPvK1EnSfV0QDE-OkoEpD7WhgU3CM048IL5YLypCtHc';
// separate login storage from the client website (both live on ngnailart-creator.github.io)
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'ngd-dashboard-auth', persistSession: true } });

// ---------- STAFF / LOGIN ----------
const LEVELS = ['None', 'View', 'Edit'];
let people = []; // loaded from ngd_staff after login
let currentUser = null;

document.getElementById('loginPwToggle').onclick = () => {
  const pw = document.getElementById('loginPass');
  pw.type = pw.type === 'password' ? 'text' : 'password';
};
document.getElementById('loginBtn').onclick = attemptLogin;
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key==='Enter') attemptLogin(); });
const STAFF_EMAIL = u => `${u.toLowerCase()}@team.ng-nailart.example`;
function showLoginError(msg){ const el=document.getElementById('loginError'); el.textContent=msg; el.style.display='block'; }
async function enterApp(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return false;
  const { data: staffRows, error } = await sb.from('ngd_staff').select('id,name,role,username,access,user_id,calendar_email,profile_title,bio,photo_path').order('created_at');
  if (error || !staffRows){ showLoginError('Could not load your account. Try again.'); return false; }
  people = staffRows.map(r => ({ id:r.id, name:r.name, role:r.role, locked:r.role==='Owner', username:r.username, access:r.access||{}, user_id:r.user_id, calEmail:r.calendar_email||'', title:r.profile_title||'', bio:r.bio||'', photo:r.photo_path||null }));
  const me = people.find(p => p.user_id === user.id);
  if (!me){ await sb.auth.signOut(); showLoginError('This account is not part of the team.'); return false; }
  currentUser = me;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  initApp();
  return true;
}
async function attemptLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) return;
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Logging in...';
  const { error } = await sb.auth.signInWithPassword({ email: STAFF_EMAIL(u), password: p });
  btn.textContent = 'Log in';
  if (error){
    showLoginError(/fetch|network/i.test(error.message) ? 'Could not reach the database. Check your connection and try again.' : 'Username or password not recognized.');
    return;
  }
  await enterApp();
}
// stay logged in on this device
sb.auth.getSession().then(({ data }) => { if (data.session) enterApp(); });

function initApp(){
const PAGES_FOR_MATRIX = ['Clients','Bookings','Knowledge','Chit-chat'];
const THEMES = {
  ng:     {bg:'#FFF7EF', tint:'#F6ECE2', hairline:'#E9E0D6', accent:'#111111', text:'#111111', muted:'#6F6A66'},
  pink:   {bg:'#FCEEF3', tint:'#FBDCE5', hairline:'#F2C9D6', accent:'#D9527A', text:'#2A1620', muted:'#8C6B78'},
  none:   {bg:'#FBF8F3', tint:'#F3EAD6', hairline:'#E9DCC0', accent:'#E8A33D', text:'#3A2F1B', muted:'#8C8367'},
  blue:   {bg:'#EDF6FB', tint:'#D6ECF5', hairline:'#C3DFEC', accent:'#2E7FA6', text:'#111E29', muted:'#66808F'},
  green:  {bg:'#EEF7EE', tint:'#DAEEDA', hairline:'#C7E2C7', accent:'#3E8C5C', text:'#14211A', muted:'#6B8C77'},
  purple: {bg:'#F4EEFB', tint:'#E7DAF6', hairline:'#DCC9EF', accent:'#8C5CC7', text:'#201A2B', muted:'#7C6E90'},
  red:    {bg:'#FCEEEE', tint:'#F8D9D9', hairline:'#F0C3C3', accent:'#C74A3E', text:'#2A1414', muted:'#8C6E6E'}
};
function applyTheme(name){
  const th = THEMES[name];
  Object.entries({'--bg':th.bg,'--tint':th.tint,'--hairline':th.hairline,'--accent':th.accent,'--text':th.text,'--muted':th.muted,'--onAccent':name==='ng'?'#FFF7EF':'#FFFFFF'})
    .forEach(([k,v]) => document.body.style.setProperty(k,v));
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.theme===name));
  try{ localStorage.setItem('ngd-theme', name); }catch(_){}
}

const TABS = [
  {key:'home', label:'Home', icon:'🏠'},
  {key:'finance', label:'Money', icon:'📊', roles:['Owner','Admin','Senior artist','Junior artist']},
  {key:'review', label:'Evaluasi', icon:'📋'},
  {key:'clients', label:'Clients', icon:'💅'},
  {key:'calendar', label:'Bookings', icon:'📅'},
  {key:'knowledge', label:'Knowledge', icon:'📚'},
  {key:'chitchat', label:'Chit-chat', icon:'💬'},
  {key:'treat', label:'Treatments', icon:'🧾'},
  {key:'chat', label:'Client chat', icon:'💌'},
  {key:'colors', label:'Colors', icon:'🎨'},
  {key:'team', label:'Team', icon:'👥'},
  {key:'website', label:'Website', icon:'🌐', roles:['Owner','Admin']},
  {key:'messages', label:'Messages', icon:'💌', roles:['Owner']},
  {key:'feedback', label:'Feedback', icon:'📮', roles:['Owner']},
  {key:'activity', label:'Activity', icon:'🕘', roles:['Owner','Admin','Senior artist','Junior artist']},
  {key:'clientact', label:'Client activity', icon:'📲', roles:['Owner']},
  {key:'pricing', label:'Pricing', icon:'💰', roles:['Owner','Admin']},
  {key:'admin', label:'Admin', icon:'🛡️', roles:['Owner']}
];
const visibleTabs = TABS.filter(tb => !tb.roles || tb.roles.includes(currentUser.role));

const nav = document.getElementById('topnav');
visibleTabs.forEach(tb => {
  const b = document.createElement('button');
  b.className = 'navbtn tap' + (tb.key==='home' ? ' active' : '');
  b.dataset.key = tb.key;
  b.innerHTML = `<span style="font-size:15px">${tb.icon}</span><span>${tb.label}</span>`;
  b.onclick = () => showPage(tb.key);
  nav.appendChild(b);
});

function showPage(key){
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.key===key));
  document.querySelectorAll('.pagesec').forEach(p => p.classList.toggle('section-hidden', p.id !== 'page-'+key));
}

const pages = document.getElementById('pages');

// ---------- HOME ----------
pages.insertAdjacentHTML('beforeend', `
<div class="pagesec section-hidden" id="page-home">
  <div class="card">
    <div class="eyebrow" id="homeDate">Today</div>
    <div class="title" id="homeGreet">Hello</div>
    <div class="row" style="margin-top:12px; gap:8px;">
      <div class="stat"><div class="num" id="homeToday">–</div><div class="label" id="homeTodayLbl">Bookings today</div></div>
      <div class="stat" id="homeReqBox" style="cursor:pointer;"><div class="num" id="homeReq">–</div><div class="label" id="homeReqLbl">Waiting for approval</div></div>
    </div>
    <div id="homeTodayList" style="margin-top:10px;"></div>
    <button class="tap" id="homeMoney" style="display:none; width:100%; margin-top:10px; padding:10px 12px; border:1px solid var(--hairline); border-radius:12px; background:#FFF7EF; text-align:left; font-family:inherit; cursor:pointer;"></button>
  </div>
  <div class="card" id="homeLogCard" style="display:none; border:1.5px solid #B0566A;">
    <div class="eyebrow" style="color:#B0566A;">Treatment log</div>
    <div class="title" style="font-size:14px;" id="homeLogTitle">Not logged yet</div>
    <div style="font-size:10.5px; color:var(--muted); margin-top:3px;" id="homeLogHint"></div>
    <div id="homeLogList" style="margin-top:6px;"></div>
  </div>
  <div class="card" id="redoCard" style="display:none;">
    <div class="row" style="justify-content:space-between; align-items:center;"><div class="eyebrow">Tag when slots open</div><button class="pill tap" id="redoRefresh" style="font-size:10px; padding:4px 9px;">↻</button></div>
    <div data-info style="font-size:11px; color:var(--muted); margin-top:4px;">Clients who tapped "Remind me" for their next set. Tag them on Instagram when that month's schedule is posted, then tap Done.</div>
    <div id="redoList" style="margin-top:8px;"></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div class="eyebrow" data-i18n="announcements">Announcements</div>
      <button class="btn-ghost tap" id="annAddBtn" style="font-size:10.5px; padding:5px 10px; display:none;" data-i18n="addOwnerOnly">+ Add (owner only)</button>
    </div>
    <div id="annList" style="margin-top:4px;"><div style="font-size:12px; color:var(--muted);">Loading…</div></div>
  </div>
  <div class="card">
    <div class="eyebrow" data-i18n="upcomingBirthdays">Upcoming birthdays</div>
    <div id="homeBirthdays" style="font-size:13px; margin-top:6px; color:var(--muted);">Loading...</div>
  </div>
</div>`);

// ---------- CLIENTS ----------
let clients = []; // loaded from ngd_clients
function mapClientRow(r){
  return { id:r.id, name:r.name, callName:r.call_name||'', birthday:r.birthday||'—', visits:r.visits||0, last:r.last_visit||'—', artist:r.artist||'—',
    pref:r.pref||[], rating:r.rating||5, note:r.note||'',
    sharedNote:r.shared_note || '', username:r.username||'', hasLogin:!!r.user_id, mustSetPin:!!r.must_set_pin, clientNote:r.client_note||'', birthdayRaw:r.birthday||'',
    sensitivity:r.sensitivity||'', clientAllergy:r.client_allergy||'', achievements:r.achievements||{}, achReq:r.ach_requests||{}, photo:r.photo_path||null, savedRewards:r.saved_rewards||[], phone:r.phone||'', instagram:r.instagram||'', area:r.area||'', referral:r.referral||'', referralDetail:r.referral_detail||'', firstVisit:r.first_visit||'' };
}
let CLIENT_PHOTO_URLS = {};
// Client photos are kept on this phone (Cache Storage): each photo is downloaded from the server only once.
const IMGCACHE = 'ngd-img-v1', imgKey = (b, p) => location.origin + '/__ngdimg/' + b + '/' + p;
async function cacheGetImg(b, p){ try { if (!window.caches) return null; const r = await (await caches.open(IMGCACHE)).match(imgKey(b, p)); return r ? await r.blob() : null; } catch(e){ return null; } }
async function cachePutImg(b, p, blob){ try { if (window.caches) await (await caches.open(IMGCACHE)).put(imgKey(b, p), new Response(blob, { headers:{ 'Content-Type': blob.type || 'image/jpeg' } })); } catch(e){} }
async function loadClientPhotos(){
  const paths = [...new Set(clients.map(c => c.photo).filter(p => p && !CLIENT_PHOTO_URLS[p]))]; if (!paths.length) return;
  const miss = [];
  await Promise.all(paths.map(async p => { const b = await cacheGetImg('ngd-client-photos', p); if (b) CLIENT_PHOTO_URLS[p] = URL.createObjectURL(b); else miss.push(p); }));
  if (miss.length){
    const { data } = await sb.storage.from('ngd-client-photos').createSignedUrls(miss, 600);
    await Promise.all((data||[]).map(async d => { if (!d.signedUrl) return;
      try { const b = await (await fetch(d.signedUrl)).blob(); await cachePutImg('ngd-client-photos', d.path, b); CLIENT_PHOTO_URLS[d.path] = URL.createObjectURL(b); } catch(e){ CLIENT_PHOTO_URLS[d.path] = d.signedUrl; } }));
  }
  renderClients((document.getElementById('clientSearch')||{}).value || '');
}
const OPEN_CLIENTS = new Set();
document.addEventListener('click', e => {
  const h = e.target.closest('[data-cltoggle]'); if (!h) return;
  const id = h.dataset.cltoggle; OPEN_CLIENTS.has(id) ? OPEN_CLIENTS.delete(id) : OPEN_CLIENTS.add(id);
  const c = clients.find(x => x.id === id), el = document.getElementById('cl-' + id); if (c && el) el.outerHTML = clientCardHtml(c, OPEN_CLIENTS.has(id));
});
function clientCardHtml(c, forceOpen){
  const open = forceOpen || OPEN_CLIENTS.has(c.id);
  const av = `<div class="avatar" style="overflow:hidden; ${open ? '' : 'width:40px; height:40px; font-size:15px;'}">${c.photo && CLIENT_PHOTO_URLS[c.photo] ? `<img src="${CLIENT_PHOTO_URLS[c.photo]}" style="width:100%; height:100%; object-fit:cover;">` : esc((c.name||'?')[0])}</div>`;
  const flags = [ (c.sensitivity || c.clientAllergy) ? '<span title="Allergy / sensitivity">⚠️</span>' : '', (c.savedRewards||[]).some(r => r.use_by > c.visits) ? '<span title="Saved reward">🎁</span>' : '', Object.keys(c.achReq||{}).length ? '<span title="Tick request">✋</span>' : '' ].join('');
  const sub = [c.instagram ? '@' + esc(String(c.instagram).replace(/^@+/, '')) : '', c.last && c.last !== '—' ? 'last ' + esc(c.last) : '', c.artist && c.artist !== '—' ? esc(c.artist) : ''].filter(Boolean).join(' · ');
  if (!open) return `
  <div class="card tap" id="cl-${c.id}" data-cltoggle="${c.id}" style="cursor:pointer; padding-top:12px; padding-bottom:12px;">
    <div class="row" style="gap:12px; align-items:center;">${av}
      <div style="flex:1; min-width:0;"><div style="font-weight:600; font-size:14.5px;">${esc(c.name)}${c.callName ? ` <span style="font-weight:400; color:var(--muted);">“${esc(c.callName)}”</span>` : ''} ${flags}</div>
        ${sub ? `<div style="font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${sub}</div>` : ''}</div>
      <div class="tag" style="flex:none;">${c.visits} visits</div><span style="color:var(--muted); font-size:14px;">›</span>
    </div>
  </div>`;
  return `
  <div class="card" id="cl-${c.id}">
    <div class="row" data-cltoggle="${c.id}" style="cursor:pointer;">
      ${av}
      <div style="flex:1">
        <div style="font-family:Montserrat,sans-serif; font-weight:600; font-size:15.5px;">${esc(c.name)}</div>
        ${c.callName ? `<div style="font-size:11.5px;">Call her <b style="font-weight:600;">${esc(c.callName)}</b></div>` : ''}
        <div style="font-size:11.5px; color:var(--muted);">Last visit ${c.last} · main artist ${esc(c.artist)}</div>
        ${artistCountLine(c)}
        ${(c.savedRewards||[]).filter(r => r.use_by > c.visits).map(r => `<div style="font-size:11px; color:#8A2D1F; margin-top:2px;">🎁 Saved reward: ${esc(rewardName(r.cycle))} · use by visit ${r.use_by}</div>`).join('')}
      </div>
      <div class="tag">${c.visits} visits</div><span style="color:var(--muted); font-size:14px; transform:rotate(90deg); display:inline-block;">›</span>
    </div>
    <div class="divider"></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
      ${c.pref.map(p => `<span class="tag">#${p}</span>`).join('')}
    </div>
    <div style="font-size:12.5px; color:var(--text); line-height:1.5;">${c.note}</div>
    <div class="row" style="margin-top:10px; justify-content:space-between;">
      <div style="font-family:Montserrat,sans-serif; font-size:12px; color:var(--accent);">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)}</div>
      <button class="btn-ghost tap" data-history="${c.id}" style="font-size:11px; padding:6px 10px;">View visit history</button>

    const isTeam = calMode==='team';
    if (document.getElementById('calAddForm')) return;
    const clientOptions = ['<option value="">No client / personal</option>'].concat(clients.map(c=>`<option value="${c.name}">${c.name}</option>`)).join('');
    card.innerHTML += `
      <div class="divider"></div>
      <div id="calAddForm" style="font-size:11.5px; font-weight:600; margin-bottom:6px;">${isTeam ? 'New booking' : 'New personal note'}</div>
      <div style="display:grid; gap:8px;">
        ${isTeam ? `<select id="calFormClient">${clientOptions}</select>` : ''}
        <div style="font-size:11px; color:var(--muted);">Who's on this ${isTeam?'booking':'note'}? (tap to add their name)</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          ${people.map(p=>`<span class="pill tap" data-pickperson="${p.name}" style="font-size:11px; padding:5px 10px;">${p.name}</span>`).join('')}
        </div>
        <input id="calFormTime" placeholder="Time (e.g. 2:00 PM)" />
        <input id="calFormService" placeholder="${isTeam ? 'Service' : 'What is this note about?'}" />
        <textarea id="calFormNotes" placeholder="Notes" style="min-height:50px;"></textarea>
        <button class="btn-primary tap" id="calSaveBtn" style="width:100%;">Save to calendar</button>
      </div>`;
    return;
  }
  if (e.target.closest('#calSaveBtn')) {
    (async () => {
      const isTeam = calMode==='team';
      const clientSel = document.getElementById('calFormClient');
      const clientName = clientSel ? clientSel.value : '';
      const pickedPeople = [...document.querySelectorAll('[data-pickperson].active')].map(el=>el.dataset.pickperson);
      const time = document.getElementById('calFormTime').value.trim() || 'All day';
      const service = document.getElementById('calFormService').value.trim();
      const dateStr = `${cursor.year}-${String(cursor.month+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;
      const payload = {
        client_name: clientName, artist: currentUser.name, people: pickedPeople.length?pickedPeople:[currentUser.name],
        booking_date: dateStr, booking_time: time, service, status: 'Confirmed', is_group: isTeam
      };
      const { data, error } = await sb.from('ngd_bookings').insert(payload).select().single();
      if (error){ alert('Could not save: ' + error.message); return; }
      const key = keyFor(selectedDay);
      if (!CAL_BOOKINGS[key]) CAL_BOOKINGS[key] = [];
      CAL_BOOKINGS[key].push({ id:data.id, client:clientName, artist:currentUser.name, time, service, status:'Confirmed', group:isTeam, people:payload.people });
      renderCalGrid(); showCalDay();
    })();
    return;
  }
});

let KB_ITEMS = []; // loaded from ngd_kb_items
let GUIDANCE_ITEMS = []; // loaded from ngd_guidance
let activeTagFilter = null;
function allTags(){ return [...new Set(KB_ITEMS.flatMap(it => it.tags))]; }
function renderTagIndex(){
  document.getElementById('kbTagIndex').innerHTML = allTags().map(t => `
    <button class="pill tap" data-tag="${t}" style="font-size:10px; padding:4px 9px; ${activeTagFilter===t?'background:var(--accent); color:#fff; border-color:var(--accent);':''}">#${t}</button>
  `).join('') + (currentUser.role==='Owner' ? `<button class="pill tap" id="kbTagAdd" style="font-size:10px; padding:4px 9px;">+ hashtag (owner)</button>` : '');
  document.querySelectorAll('[data-tag]').forEach(btn => {
    btn.onclick = () => { activeTagFilter = activeTagFilter===btn.dataset.tag ? null : btn.dataset.tag; renderTagIndex(); renderKB(document.getElementById('kbSearch').value); };
  });
}
function renderKB(filter){
  const f = (filter||'').toLowerCase().trim();
  const results = KB_ITEMS.filter(it => {
    const matchesText = !f || (it.q+' '+it.a+' '+it.tags.join(' ')).toLowerCase().includes(f);
    const matchesTag = !activeTagFilter || it.tags.includes(activeTagFilter);
    return matchesText && matchesTag;
  });
  document.getElementById('kbResults').innerHTML = results.length ? results.map(it => `
    <div class="card">
      <div style="font-weight:600; font-size:13.5px;">"${it.q}"</div>
      <div style="font-size:12.5px; color:var(--text); margin-top:6px; line-height:1.5;">${it.a}</div>
      <div class="row" style="margin-top:8px; gap:6px;">
        ${it.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
        <span class="tag" style="background:var(--accent); color:#fff;">✓ approved</span>
      </div>
    </div>`).join('') : `<div class="card"><div style="font-size:12.5px; color:var(--muted);">No materials yet — add the first one below.</div></div>`;
}
function renderGuidance(){
  document.getElementById('guidanceResults').innerHTML = GUIDANCE_ITEMS.length ? GUIDANCE_ITEMS.map(g => `
    <div class="card">
      <div style="font-weight:600; font-size:13.5px;">${g.title}</div>
      <div style="font-size:12.5px; color:var(--text); margin-top:6px; line-height:1.5;">${g.content}</div>
    </div>`).join('') : `<div class="card"><div style="font-size:12.5px; color:var(--muted);">No guidance entries yet.</div></div>`;
}
document.getElementById('kbSearch').oninput = e => renderKB(e.target.value);
document.getElementById('kbSearchBtn').onclick = () => renderKB(document.getElementById('kbSearch').value);
// ---------- DP proof cleanup: files are deleted 45 days after the booking date (runs at most once a day) ----------
setTimeout(async () => {
  try {
    const key = 'ngd-dp-cleanup', today = new Date().toISOString().slice(0,10);
    if (localStorage.getItem(key) === today) return;
    const { data: paths, error } = await sb.rpc('ngd_dp_proofs_to_delete');
    if (error) return;
    if ((paths||[]).length){
      const rm = await sb.storage.from('ngd-dp').remove(paths);
      if (rm.error) return;
      await sb.rpc('ngd_dp_proofs_deleted', { p_paths: paths });
    }
    localStorage.setItem(key, today);
  } catch(e){}
}, 4000);

  // login details bottom-left
  g.fillStyle = MUT; g.font = `500 24px ${F}`; sp('6px');
  g.fillText('USERNAME', L, 880); g.fillText('CODE', L, 1010);
  sp('0px'); g.fillStyle = INK; g.font = `56px ${F}`; g.fillText(user, L, 950);

}

let PRICING = {owner:{label:'Owner',sections:[]}, nayla:{label:'Nayla (senior)',sections:[]}, fida:{label:'Fida (junior)',sections:[]}};
function buildPricingFromRows(rows){
  const out = {owner:{label:'Owner',sections:[]}, nayla:{label:'Nayla (senior)',sections:[]}, fida:{label:'Fida (junior)',sections:[]}};
  const ORDER = ['Base','Remove','Callus Treatment — Kumi','Press-On Nails','Design','Omakase Design','Add-On'];
  rows = [...rows].sort((x,y) => ((ORDER.indexOf(x.section)+99)%99 - (ORDER.indexOf(y.section)+99)%99) || (x.sort_order - y.sort_order));
  rows.forEach(r => {
    if (!out[r.person]) return;
    let sec = out[r.person].sections.find(s => s.name === r.section);
    if (!sec){ sec = {name:r.section, items:[]}; out[r.person].sections.push(sec); }
    sec.items.push({id:r.id, label:r.item, price:r.price});
  });
  return out;
}

function renderMonthlySummary(){
  const now = new Date();
  const summary = {};
  Object.entries(CAL_BOOKINGS).forEach(([key, items]) => {
    const [y,m] = key.split('-').map(Number);
    if (y !== now.getFullYear() || m !== now.getMonth()) return;
    items.forEach(b => {
      if (!b.group) return;
      const name = b.artist;
      if (!summary[name]) summary[name] = {clients:0, hand:0, feet:0, pressOn:0};
      summary[name].clients++;
      const s = (b.service||'').toLowerCase();
      if (s.includes('feet') || s.includes('pedicure') || s.includes('callus')) summary[name].feet++;
      else if (s.includes('press')) summary[name].pressOn++;
      else summary[name].hand++;
    });

function parsePrice(str){
  const s = String(str||'').replace(/,/g,'.');
  const m = s.match(/(\d+(?:\.\d+)?)\s*(?:[–-]\s*(\d+(?:\.\d+)?))?\s*(K|k|jt|rb)?/);
  if (!m) return 0;
  const mult = /jt/.test(m[3]||'') ? 1e6 : (m[3] ? 1000 : 1);
  return Math.round(parseFloat(m[1]) * mult);
}

document.addEventListener('click', async e => {
  const t = e.target;
  if (t.dataset.mklogin){
    const c = clients.find(x => x.id === t.dataset.mklogin);
    const u = prompt(`Username for ${c.name} (no spaces, e.g. ${c.name.split(' ')[0]}):`, c.name.split(' ')[0]);
    if (!u) return;
    const { data, error } = await sb.rpc('ngd_create_client_login', { p_client_id: c.id, p_username: u.trim() });
    if (error) return alert('Could not create login: ' + error.message);
    c.username = u.trim(); c.hasLogin = true; c.mustSetPin = true; renderClients(document.getElementById('clientSearch').value);
    openWelcome(c, u.trim(), data);
  }
  if (t.dataset.resetpin){
    const c = clients.find(x => x.id === t.dataset.resetpin);
    if (!confirm(`Reset ${c.name}'s PIN?`)) return;
    const { data, error } = await sb.rpc('ngd_reset_client_pin', { p_client_id: c.id });
    if (error) return alert(error.message);
    c.mustSetPin = true; renderClients(document.getElementById('clientSearch').value);
    openWelcome(c, c.username, data);
  }
  if (t.dataset.welcome){
    const c = clients.find(x => x.id === t.dataset.welcome);
    if (!confirm(`Make a welcome card for ${c.name}?\n\nThis creates a new one-time code for her. Any code you gave her before stops working.`)) return;
    const { data, error } = await sb.rpc('ngd_reset_client_pin', { p_client_id: c.id });
    if (error) return alert(error.message);
    c.mustSetPin = true; renderClients(document.getElementById('clientSearch').value);
    openWelcome(c, c.username, data);
  }
  if (t.dataset.dellogin){
    const c = clients.find(x => x.id === t.dataset.dellogin);
    if (!confirm(`Delete ${c.name}'s website username? Their treatment history stays in the dashboard.`)) return;
    const { error } = await sb.rpc('ngd_delete_client_login', { p_client_id: c.id });
    if (error) return alert(error.message);
    c.username = ''; c.hasLogin = false; c.mustSetPin = false; renderClients(document.getElementById('clientSearch').value);
  }
  if (t.dataset.delclient){
    const c = clients.find(x => x.id === t.dataset.delclient); if (!c) return;
    const { data: f, error: fe } = await sb.rpc('ngd_client_files', { p_client_id: c.id });
    if (fe) return alert(fe.message);
    if (f.upcoming > 0) return alert(`${c.name} still has ${f.upcoming} upcoming booking${f.upcoming > 1 ? 's' : ''}.\n\nCancel it in Bookings first, then delete the client.`);
    if (!confirm(`Delete ${c.name} permanently?\n\nThis removes their client card, website login, treatment history, loyalty stamps, notes, coupons, letters, chat, love notes, Today's Sets and photos.\n\nPast bookings stay in the schedule with their name only.\n\nThis cannot be undone.`)) return;
    const typed = prompt(`To confirm, type the client's name exactly:\n${c.name}`);
    if (typed === null) return;
    if (typed.trim().toLowerCase() !== String(c.name).trim().toLowerCase()) return alert('The name does not match. Nothing was deleted.');
    t.disabled = true; t.textContent = 'Deleting…';
    const rm = async (bucket, paths) => { if (paths && paths.length) await sb.storage.from(bucket).remove(paths); };
    const { error } = await sb.rpc('ngd_delete_client', { p_client_id: c.id });
    if (error){ t.disabled = false; t.textContent = '🗑 Delete client'; return alert(error.message); }
    await Promise.all([rm('ngd-client-photos', f.photos), rm('ngd-dp', f.dp), rm('ngd-sets', f.sets)]).catch(() => {});
    clients = clients.filter(x => x.id !== c.id);
    renderClients(document.getElementById('clientSearch').value);
    alert(`${c.name} has been deleted. This is recorded in Activity.`);
  }
  if (t.dataset.editdetails){
    const id = t.dataset.editdetails, box = document.getElementById('edit-' + id);
    if (box.innerHTML){ box.innerHTML = ''; return; }
    const c = clients.find(x => x.id === id);
    box.innerHTML = `<div style="display:grid; gap:8px; margin-bottom:10px;">${clientFormFields(c)}<button class="btn-primary tap" data-savedetails="${id}">Save details</button></div>`;
    return;
  }
  if (t.dataset.savedetails){
    const f = readClientForm();
    if (!f.name) return alert('Client name is required.');
    const { error } = await sb.from('ngd_clients').update(f).eq('id', t.dataset.savedetails);
    if (error) return alert('Could not save: ' + error.message);
    await reloadClients(); return;
  }
  if (t.dataset.editname || t.dataset.editvisits || t.dataset.editbday || t.dataset.renamelogin){
    const id = t.dataset.editname || t.dataset.editvisits || t.dataset.editbday || t.dataset.renamelogin;
    const c = clients.find(x => x.id === id);
    if (t.dataset.renamelogin){
      const u = prompt('New username (no spaces):', c.username); if (!u || u.trim() === c.username) return;
      const { error } = await sb.rpc('ngd_rename_client_login', { p_client_id: id, p_username: u.trim() });
      if (error) return alert(error.message);
      alert(`Username changed to ${u.trim()}. The client's PIN stays the same.`);
    } else {
      let patch = null;
      if (t.dataset.editname){ const v = prompt('Client name:', c.name); if (!v || !v.trim()) return; patch = {name: v.trim()}; }
      if (t.dataset.editvisits){ const v = prompt(`Total visits so far for ${c.name} (e.g. 34). The client's loyalty card updates right away:`, c.visits); if (v === null) return;
        const n = parseInt(v); if (isNaN(n) || n < 0) return alert('Enter a number.'); patch = {visits: n}; }
      if (t.dataset.editbday){ const v = prompt('Birthday as YYYY-MM-DD (e.g. 1998-03-14) or MM-DD (e.g. 03-14):', c.birthdayRaw); if (v === null) return;
        if (v && !/^(\d{4}-)?\d{2}-\d{2}$/.test(v.trim())) return alert('Use YYYY-MM-DD or MM-DD.'); patch = {birthday: v.trim()}; }
      const { error } = await sb.from('ngd_clients').update(patch).eq('id', id);
      if (error) return alert(error.message);
    }
    await reloadClients(); return;
  }
  if (t.dataset.history){
    const box = document.getElementById('hist-' + t.dataset.history);
    if (box.innerHTML){ box.innerHTML = ''; return; }
    const { data } = await sb.from('ngd_treatments').select('*').eq('client_id', t.dataset.history).order('treatment_date', {ascending:false});
    box.innerHTML = (data||[]).length ? data.map(treatmentRowHtml).join('') : '<div style="font-size:12px; color:var(--muted); margin-top:8px;">No treatments logged yet.</div>';
  }
  if (t.dataset.newtreat){ openTreatmentForm(t.dataset.newtreat); }
  if (t.dataset.confirm){
    const { error } = await sb.rpc('ngd_confirm_treatment', { p_treatment_id: t.dataset.confirm });
    if (error) return alert(error.message);
    await loadTreatments(); await reloadClients();
  }
  if (t.dataset.canceltreat || t.dataset.deltreat){
    const id = t.dataset.canceltreat || t.dataset.deltreat;
    const tr = TREATMENTS.find(x => x.id === id) || {}; const cn = (clients.find(c => c.id === tr.client_id)||{}).name || 'this client';
    if (!confirm(`Delete this treatment for ${cn} (${tr.treatment_date||''})?` + (tr.status === 'confirmed' ? `\n\nIt was already confirmed, so ${cn}'s visit count goes down by 1. A coupon used on it becomes usable again.` : '') + '\n\nThis is recorded in Activity.')) return;
    const { error } = await sb.rpc('ngd_delete_treatment', { p_id: id });
    if (error) return alert(error.message);
    await loadTreatments(); await reloadClients();
  }
  if (t.dataset.edittreat){
    let tr = TREATMENTS.find(x => x.id === t.dataset.edittreat);
    if (!tr){ const { data } = await sb.from('ngd_treatments').select('*').eq('id', t.dataset.edittreat).maybeSingle(); tr = data; }
    if (tr) openTreatmentForm(tr.client_id, tr);
  }
});

  </div>`;
}
async function loadTreatments(){
  const { data } = await sb.from('ngd_treatments').select('*').neq('status','cancelled').order('created_at', {ascending:false}).limit(60);
  TREATMENTS = data || [];
  loadArtistCounts();
  const mineOnly = !(isOwner || currentUser.role === 'Admin');
  const vis = mineOnly ? TREATMENTS.filter(t => t.artist_id === currentUser.id || t.created_by === currentUser.id) : TREATMENTS;
  const pend = vis.filter(t => t.status === 'pending'), done = vis.filter(t => t.status === 'confirmed').slice(0, 20);
  keepScroll(() => {
  document.getElementById('treatPending').innerHTML = pend.length ? pend.map(treatmentRowHtml).join('') : '<div style="font-size:12px; color:var(--muted);">Nothing waiting.</div>';
  document.getElementById('treatDone').innerHTML = done.length ? done.map(treatmentRowHtml).join('') : '<div style="font-size:12px; color:var(--muted);">No confirmed treatments yet.</div>';

// Compress any photo (HD, iPhone HEIC-converted, etc.) in the browser before upload.
// Uses WebP where the browser supports it, otherwise JPEG (iPhone Safari), and keeps shrinking until under the size limit.
const MAX_UPLOAD = 900 * 1024;
function loadImg(file){
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('Could not read this image')); img.src = URL.createObjectURL(file); });
}
function canvasBlob(cv, type, q){ return new Promise(res => cv.toBlob(b => res(b), type, q)); }
async function resizeImage(file, maxSide, quality){
  const img = await loadImg(file);
  let side = maxSide, q = quality;
  for (let attempt = 0; attempt < 6; attempt++){
    const k = Math.min(1, side / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    let b = await canvasBlob(cv, 'image/webp', q);
    if (!b || b.type !== 'image/webp') b = await canvasBlob(cv, 'image/jpeg', q);
    if (!b) throw new Error('Could not compress this photo');
    if (b.size <= MAX_UPLOAD) return b;
    q = Math.max(0.6, q - 0.08); side = Math.round(side * 0.85);
  }
  throw new Error('This photo is too large even after compressing');
}
const extFor = b => b.type === 'image/webp' ? 'webp' : 'jpg';
async function loadColors(){
  const { data } = await sb.from('ngd_colors').select('*').order('sort_order').order('created_at');
  COLORS = data || [];
  document.getElementById('colGrid').innerHTML = COLORS.map(c => `<div class="card" style="padding:6px; margin:0;">
    <img src="${colorUrl(c.thumb_path || c.image_path)}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px;" loading="lazy" />
    <div style="font-size:10.5px; margin-top:4px;"><b>${esc(c.code)}</b> ${esc(c.name||'')}</div>
    <span class="tap" data-delcolor="${c.id}" style="font-size:10px; color:var(--muted); cursor:pointer;">Delete</span></div>`).join('')
    || '<div style="grid-column:1/-1; font-size:12px; color:var(--muted);">No colors yet.</div>';
}
document.getElementById('colSave').onclick = async () => {
  const code = document.getElementById('colCode').value.trim(), file = document.getElementById('colFile').files[0];
  if (!code || !file) return alert('Add a code and a photo.');
  const btn = document.getElementById('colSave'); btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const id = crypto.randomUUID();
    const full = await resizeImage(file, 1200, 0.82), thumb = await resizeImage(file, 400, 0.72);
    const p1 = `colors/${id}.${extFor(full)}`, p2 = `colors/${id}_t.${extFor(thumb)}`;
    let r = await sb.storage.from(COLOR_BUCKET).upload(p1, full, {contentType:full.type}); if (r.error) throw r.error;
    r = await sb.storage.from(COLOR_BUCKET).upload(p2, thumb, {contentType:thumb.type}); if (r.error) throw r.error;
    const ins = await sb.from('ngd_colors').insert({code, name: document.getElementById('colName').value.trim() || null, image_path:p1, thumb_path:p2, added_by: currentUser.id, sort_order: COLORS.length});
    if (ins.error) throw ins.error;
    document.getElementById('colCode').value = ''; document.getElementById('colName').value = ''; document.getElementById('colFile').value = '';
    await loadColors();
  } catch(err){ alert('Upload failed: ' + err.message); }
  btn.disabled = false; btn.textContent = 'Upload color';
};
document.addEventListener('click', async e => {

  await sb.storage.from(COLOR_BUCKET).remove([c.image_path, c.thumb_path].filter(Boolean));
  const { error } = await sb.from('ngd_colors').delete().eq('id', id);

  loadColors();
});

// ---------- TODAY'S SET (photos → client receipt card, kept 7 days) ----------
const SET_BUCKET = 'ngd-sets';
let SETS_BY_T = {};
async function loadSets(){
  const { data } = await sb.from('ngd_sets').select('*').order('created_at',{ascending:false}).limit(200);
  SETS_BY_T = {};
  (data||[]).forEach(x => { if (x.treatment_id) (SETS_BY_T[x.treatment_id] = SETS_BY_T[x.treatment_id] || []).push(x); });
  // clean up photos older than 7 days (files are deleted, the record stays)
  const expired = (data||[]).filter(x => x.status === 'sent' && new Date(x.expires_at) < new Date() && (x.photos||[]).length);
  for (const x of expired){
    if (!(isOwner || currentUser.role === 'Admin' || x.created_by === currentUser.id)) continue;
    await sb.storage.from(SET_BUCKET).remove(x.photos);
    await sb.from('ngd_sets').update({status:'expired', photos:[]}).eq('id', x.id);
  }
}
function openSetEditor(tid){
  const t = TREATMENTS.find(x => x.id === tid); if (!t) return;
  const client = clients.find(c => c.id === t.client_id) || {name:'Client'};
  const prev = (SETS_BY_T[tid]||[]).find(x => x.status === 'sent' && new Date(x.expires_at) > new Date());
  let files = [];
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed; inset:0; background:rgba(17,17,17,.45); z-index:80; display:flex; align-items:flex-end; justify-content:center;';
  ov.innerHTML = `<div style="background:var(--bg); width:100%; max-width:440px; max-height:92vh; overflow:auto; border-radius:22px 22px 0 0; padding:20px 18px 26px;">
    <div class="row" style="justify-content:space-between;"><div><div class="eyebrow">Today's Set</div><div class="title" style="font-size:13px;">${esc(client.name)} · ${t.treatment_date}</div></div><span class="tap" id="setClose" style="cursor:pointer; font-size:20px;">✕</span></div>
    ${prev ? `<div style="font-size:11.5px; background:var(--tint); border-radius:10px; padding:8px 10px; margin-top:10px;">Already sent — visible to the client until <b>${new Date(prev.expires_at).toLocaleString('id-ID')}</b>. Sending again creates a new card.</div>` : ''}
    <label style="display:block; font-size:10.5px; color:var(--muted); margin:12px 0 6px;">Set name (shown on the receipt, e.g. Soft Glazed Almond)</label>
    <input id="setTitle" maxlength="40" value="${esc(((t.items||[])[0]||{}).label || '')}" />
    <label style="display:block; font-size:10.5px; color:var(--muted); margin:12px 0 6px;">Photos — up to 3. Use ← → to arrange; the first photo is the big one.</label>
    <input id="setFiles" type="file" accept="image/*" multiple />
    <div id="setThumbs" style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;"></div>
    <div data-info style="font-size:10.5px; color:var(--muted); margin-top:10px;">⏳ Photos are kept for <b>7 days</b> after you send, so the client can download their card. After that the photos are deleted automatically.</div>
    <button class="btn-primary tap" id="setSend" style="width:100%; margin-top:14px; padding:12px;">Send to ${esc(client.name)}</button>
  </div>`;
  document.body.appendChild(ov);
  const thumbs = () => {
    document.getElementById('setThumbs').innerHTML = files.map((f,i) => `<div style="position:relative;">
      <img src="${f.url}" style="width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; ${i===0?'outline:2px solid var(--accent);':''}" />
      <div class="row" style="justify-content:space-between; margin-top:4px; font-size:13px;">
        <span class="tap" data-mv="${i}" data-d="-1" style="cursor:pointer; ${i===0?'opacity:.25':''}">←</span>
        <span style="font-size:10px; color:var(--muted);">${i+1}</span>
        <span class="tap" data-mv="${i}" data-d="1" style="cursor:pointer; ${i===files.length-1?'opacity:.25':''}">→</span>
        <span class="tap" data-rm="${i}" style="cursor:pointer;">✕</span></div></div>`).join('');
  };
  ov.addEventListener('click', e => {
    if (e.target.id === 'setClose' || e.target === ov){ ov.remove(); return; }
    const mv = e.target.dataset && e.target.dataset.mv;
    if (mv !== undefined){ const i = +mv, j = i + (+e.target.dataset.d); if (j < 0 || j >= files.length) return; [files[i], files[j]] = [files[j], files[i]]; thumbs(); }
    const rm = e.target.dataset && e.target.dataset.rm;
    if (rm !== undefined){ files.splice(+rm, 1); thumbs(); }
  });
  document.getElementById('setFiles').onchange = e => {
    const add = [...e.target.files].map(f => ({file:f, url:URL.createObjectURL(f)}));
    const over = files.length + add.length > 3;
    files = files.concat(add).slice(0, 3); e.target.value = ''; thumbs();
    if (over) alert('Maximum 3 photos — extra photos were not added.');
  };
  document.getElementById('setSend').onclick = async () => {
    if (!files.length) return alert('Add at least one photo.');
    const btn = document.getElementById('setSend'); btn.disabled = true; btn.textContent = 'Sending…';
    let draftId = null;
    try {
      const ins = await sb.from('ngd_sets').insert({treatment_id:t.id, client_id:t.client_id, created_by:currentUser.id, title:document.getElementById('setTitle').value.trim() || null}).select().single();
      if (ins.error) throw ins.error;
      draftId = ins.data.id;
      const paths = [];
      for (let i = 0; i < files.length; i++){
        const blob = await resizeImage(files[i].file, 1440, 0.85);
        const path = `sets/${ins.data.id}/${i+1}.${extFor(blob)}`;
        const up = await sb.storage.from(SET_BUCKET).upload(path, blob, {contentType:blob.type, upsert:true});
        if (up.error) throw up.error;
        paths.push(path);
      }
      const upd = await sb.from('ngd_sets').update({photos: paths}).eq('id', ins.data.id);
      if (upd.error) throw upd.error;
      const snd = await sb.rpc('ngd_send_set', { p_set_id: ins.data.id });
      if (snd.error) throw snd.error;
      ov.remove();
      alert(`Sent to ${client.name} ♡\nIt shows on their page as a notification. Photos stay until ${new Date(snd.data).toLocaleString('id-ID')}.${client.hasLogin ? '' : '\n\nNote: this client has no website login yet — create one so they can see it.'}`);
      await loadSets(); await loadTreatments();
      if (window._fromHome){ window._fromHome = false; showPage('home'); window.scrollTo(0, 0); loadHomeLog(); }
    } catch(err){
      if (draftId){ const pre = `sets/${draftId}/`; await sb.storage.from(SET_BUCKET).remove([1,2,3].flatMap(n => [pre+n+'.webp', pre+n+'.jpg'])); await sb.from('ngd_sets').delete().eq('id', draftId); }
      btn.disabled = false; btn.textContent = 'Send to ' + client.name; alert('Could not send: ' + err.message);
    }
  };
}

function searchableClientSelect(sel){
  if (!sel || sel.dataset.search || sel.disabled) return; sel.dataset.search = '1';
  const fixed = [...sel.options].filter(o => !o.value || o.value.startsWith('__'));
  const all = [...sel.options].filter(o => o.value && !o.value.startsWith('__')).sort((a, b) => a.text.localeCompare(b.text, 'id', { sensitivity:'base' }));
  const hay = o => { const c = (typeof clients !== 'undefined' ? clients : []).find(x => x.id === o.value) || {}; return (o.text + ' ' + (c.instagram||'') + ' ' + (c.phone||'')).toLowerCase(); };
  const q = document.createElement('input'); q.type = 'search'; q.autocomplete = 'off'; q.setAttribute('autocapitalize', 'off');

  sel.before(q);

    const v = q.value.trim().toLowerCase().replace(/^@/, ''), cur = sel.value;
    const starts = all.filter(o => o.text.toLowerCase().startsWith(v)), inc = v ? all.filter(o => !o.text.toLowerCase().startsWith(v) && hay(o).includes(v)) : [];

    else if (!v) sel.value = cur;
  };
  q.addEventListener('input', draw); draw();
}

  const el = document.getElementById('annList');
  el.innerHTML = (data||[]).length ? data.map(a => `<div style="border-top:1px solid var(--hairline); padding:8px 0;">
    <div class="row" style="justify-content:space-between; align-items:flex-start;"><div class="title" style="font-size:14px;">${esc(a.title)}</div>${isOwner ? `<span class="tap" data-anndel="${a.id}" style="cursor:pointer; color:var(--muted); font-size:12px;">✕</span>` : ''}</div>
    ${a.body ? `<div style="font-size:12.5px; color:var(--muted); margin-top:3px; white-space:pre-wrap;">${esc(a.body)}</div>` : ''}
    <div style="font-size:10px; color:var(--muted); margin-top:3px;">${esc(a.created_by_name||'')} · ${new Date(a.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></div>`).join('')
    : `<div style="font-size:12px; color:var(--muted);">${currentLang === 'id' ? 'Belum ada pengumuman.' : 'No announcements yet.'}</div>`;
}
if (isOwner) document.getElementById('annAddBtn').style.display = '';
document.getElementById('annAddBtn').onclick = async () => {
  const title = prompt('Announcement title (for the team):'); if (!title || !title.trim()) return;
  const body = prompt('Details (optional):') || '';
  const { error } = await sb.from('ngd_team_announcements').insert({ title: title.trim(), body: body.trim() || null, created_by: currentUser.id, created_by_name: currentUser.name });
  if (error) return alert(error.message); loadAnnouncements();
};
document.addEventListener('click', async e => { const d = e.target.closest('[data-anndel]'); if (!d) return;
  if (!confirm('Delete this announcement?')) return; const { error } = await sb.from('ngd_team_announcements').delete().eq('id', d.dataset.anndel); if (error) return alert(error.message); loadAnnouncements(); });
document.getElementById('langToggle').addEventListener('click', () => { renderHome(); loadAnnouncements(); });
loadAnnouncements();
loadBookCfg(); loadAppts().then(renderHome); renderHome(); renderBkDay(); loadNotifs();
setInterval(() => { loadNotifs(); loadAppts(); reloadCal(); if (!BK_EDIT) renderBkMonth({ auto:true }); }, 60000);
document.addEventListener('click', async e => { const bf = e.target.closest('[data-bookfor]'); if (!bf) return;
  showPage('calendar'); if (!BOOK_CFG) await loadBookCfg();
  document.getElementById('bkAddForm').innerHTML = bookAddFormHtml();
  const sel = document.getElementById('bkfClient'); if (sel) sel.value = bf.dataset.bookfor;
  document.getElementById('bkAddForm').scrollIntoView({ behavior:'smooth', block:'center' }); });

document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
document.getElementById('changePwBtn').onclick = async () => {
  const pw = prompt('New password (min. 6 characters):');
  if (!pw) return;
  if (pw.length < 6){ alert('Password must be at least 6 characters.'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  alert(error ? 'Could not change password: ' + error.message : 'Password changed.');
};

} // end initApp()
</script>
</body>
</html>
