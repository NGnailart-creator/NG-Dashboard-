<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>NG Nail Art Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  html,body{height:100%;margin:0;}
  ::-webkit-scrollbar{display:none;}
  body{
    --bg:#FCEEF3; --surface:#FFFFFF; --text:#2A1620; --muted:#8C6B78;
    --accent:#D9527A; --onAccent:#FFFFFF; --tint:#FBDCE5; --hairline:#F2C9D6;
    background:var(--bg); font-family:Inter,sans-serif; color:var(--text);
  }
  .tap{transition:transform .12s ease, opacity .12s ease;}
  .tap:active{transform:scale(.96); opacity:.85;}
  .card{background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 1px 2px rgba(42,22,32,0.06); margin-bottom:12px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.02em;}
  .title{font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--text); margin-top:2px;}
  .pill{padding:6px 12px; border-radius:999px; font-family:Inter,sans-serif; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--hairline); background:transparent; color:var(--text);}
  .pill.active{background:var(--accent); color:var(--onAccent); border-color:var(--accent);}
  .stat{flex:1; text-align:center; background:var(--tint); border-radius:12px; padding:10px 6px;}
  .stat .num{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:var(--accent);}
  .stat .label{font-family:Inter,sans-serif; font-size:10px; color:var(--muted); margin-top:2px;}
  .toggle{width:38px; height:22px; border-radius:999px; background:var(--hairline); position:relative; cursor:pointer; flex-shrink:0;}
  .toggle.on{background:var(--accent);}
  .toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s ease;}
  .toggle.on .knob{left:18px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 9px; border-radius:999px; background:var(--tint); color:var(--accent);}
  .topnav{position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--hairline); padding:10px 16px; display:flex; gap:6px; overflow-x:auto;}
  .navbtn{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 10px; border-radius:12px; font-family:Inter,sans-serif; font-size:10px; color:var(--muted); background:none; border:none; cursor:pointer; white-space:nowrap;}
  .navbtn.active{color:var(--accent); background:var(--tint);}
  .page{max-width:420px; margin:0 auto; padding:12px 16px 40px;}
  .section-hidden{display:none;}
  .avatar{width:40px; height:40px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:15px; flex-shrink:0;}
  .row{display:flex; align-items:center; gap:10px;}
  .btn-primary{background:var(--accent); color:var(--onAccent); border:none; border-radius:10px; padding:9px 14px; font-family:Inter,sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;}
  .btn-ghost{background:transparent; border:1px solid var(--hairline); border-radius:10px; padding:9px 14px; font-family:Inter,sans-serif; font-weight:600; font-size:12.5px; cursor:pointer; color:var(--text);}
  .themeRow{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.active{border-color:var(--text);}
  input,textarea,select{width:100%; font-family:Inter,sans-serif; font-size:13px; padding:9px 11px; border-radius:10px; border:1px solid var(--hairline); background:var(--surface); color:var(--text);}
  .divider{height:1px; background:var(--hairline); margin:10px 0;}
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .loginCard{max-width:340px; width:100%; background:var(--surface); border-radius:20px; padding:28px 22px; box-shadow:0 4px 16px rgba(42,22,32,0.1);}
  .pwWrap{position:relative;}
  .pwWrap .eye{position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:15px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginCard">
    <div style="font-family:'Fraunces',serif; font-size:22px; font-weight:600; text-align:center; margin-bottom:4px;">Natasya Gishelle</div>
    <div style="text-align:center; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:22px;">Nail Art Dashboard</div>
    <div style="display:grid; gap:10px;">
      <input id="loginUser" placeholder="Username" autocomplete="username" />

        <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" style="padding-right:38px;" />

      </div>
      <div id="loginError" style="font-size:11.5px; color:#C74A3E; display:none;">Username or password not recognized.</div>
      <button class="btn-primary tap" id="loginBtn" style="width:100%; margin-top:6px;">Log in</button>
    </div>
    <div style="font-size:10.5px; color:var(--muted); text-align:center; margin-top:16px;">Forgot your password? Ask the owner to look it up in Admin.</div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<div class="topnav" id="topnav"></div>
<div style="display:flex; justify-content:flex-end; padding:6px 16px 0;">
  <button id="langToggle" class="pill tap" style="font-size:10.5px; padding:5px 10px;">🌐 EN / ID</button>
</div>
<div class="page" id="pages"></div>
</div>

<script>
// ---------- STAFF / LOGIN ----------
// TODO: once Supabase is connected, replace this with a real `staff` table lookup.
const LEVELS = ['None', 'View', 'Edit'];
const people = [
  {name:'Gisel', role:'Owner', locked:true, username:'gisel_owner', password:'owner2026', access:{Clients:2, Bookings:2, Knowledge:2, 'Chit-chat':2}},
  {name:'Nayla', role:'Senior artist', locked:false, username:'nayla_senior', password:'nayla2026', access:{Clients:1, Bookings:2, Knowledge:1, 'Chit-chat':1}},
  {name:'Amanda', role:'Junior artist', locked:false, username:'amanda_jr', password:'amanda123', access:{Clients:1, Bookings:2, Knowledge:1, 'Chit-chat':1}},
  {name:'IG Admin', role:'Instagram admin', locked:false, username:'ng_igadmin', password:'admin2026', access:{Clients:1, Bookings:2, Knowledge:1, 'Chit-chat':1}}
];
let currentUser = null;

document.getElementById('loginPwToggle').onclick = () => {
  const pw = document.getElementById('loginPass');
  pw.type = pw.type === 'password' ? 'text' : 'password';
};
document.getElementById('loginBtn').onclick = attemptLogin;
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key==='Enter') attemptLogin(); });
function attemptLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const match = people.find(person => person.username === u && person.password === p);
  if (!match){
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  currentUser = match;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  initApp();
}

function initApp(){
const PAGES_FOR_MATRIX = ['Clients','Bookings','Knowledge','Chit-chat'];
const THEMES = {
  pink:   {bg:'#FCEEF3', tint:'#FBDCE5', hairline:'#F2C9D6', accent:'#D9527A', text:'#2A1620', muted:'#8C6B78'},
  none:   {bg:'#FBF8F3', tint:'#F3EAD6', hairline:'#E9DCC0', accent:'#E8A33D', text:'#3A2F1B', muted:'#8C8367'},
  blue:   {bg:'#EDF6FB', tint:'#D6ECF5', hairline:'#C3DFEC', accent:'#2E7FA6', text:'#111E29', muted:'#66808F'},
  green:  {bg:'#EEF7EE', tint:'#DAEEDA', hairline:'#C7E2C7', accent:'#3E8C5C', text:'#14211A', muted:'#6B8C77'},
  purple: {bg:'#F4EEFB', tint:'#E7DAF6', hairline:'#DCC9EF', accent:'#8C5CC7', text:'#201A2B', muted:'#7C6E90'},
  red:    {bg:'#FCEEEE', tint:'#F8D9D9', hairline:'#F0C3C3', accent:'#C74A3E', text:'#2A1414', muted:'#8C6E6E'}
};
function applyTheme(name){
  const th = THEMES[name];
  Object.entries({'--bg':th.bg,'--tint':th.tint,'--hairline':th.hairline,'--accent':th.accent,'--text':th.text,'--muted':th.muted})
    .forEach(([k,v]) => document.body.style.setProperty(k,v));
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.theme===name));
}

const TABS = [
  {key:'home', label:'Home', icon:'🏠'},
  {key:'clients', label:'Clients', icon:'💅'},
  {key:'calendar', label:'Bookings', icon:'📅'},
  {key:'knowledge', label:'Knowledge', icon:'📚'},
  {key:'chitchat', label:'Chit-chat', icon:'💬'},
  {key:'team', label:'Team', icon:'👥'},
  {key:'pricing', label:'Pricing', icon:'💰', roles:['Owner','Instagram admin']},
  {key:'admin', label:'Admin', icon:'🛡️', roles:['Owner']}
];
const visibleTabs = TABS.filter(tb => !tb.roles || tb.roles.includes(currentUser.role));

const nav = document.getElementById('topnav');
visibleTabs.forEach(tb => {
  const b = document.createElement('button');
  b.className = 'navbtn tap' + (tb.key==='home' ? ' active' : '');
  b.dataset.key = tb.key;
  b.innerHTML = `<span style="font-size:15px">${tb.icon}</span><span>${tb.label}</span>`;
  b.onclick = () => showPage(tb.key);
  nav.appendChild(b);
});

function showPage(key){
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.key===key));
  document.querySelectorAll('.pagesec').forEach(p => p.classList.toggle('section-hidden', p.id !== 'page-'+key));
}

const pages = document.getElementById('pages');

// ---------- HOME ----------
pages.innerHTML += `
<div class="pagesec section-hidden" id="page-home">
  <div class="card">
    <div class="eyebrow" data-i18n="today">Today</div>
    <div class="title" data-i18n="goodMorning">Good morning, Gisel</div>
    <div style="font-size:10.5px; color:var(--muted); margin-top:4px;" data-i18n="homeDefaultNote">Home is set as your default page — it opens here automatically when you log in.</div>
    <div class="row" style="margin-top:12px; gap:8px;">
      <div class="stat"><div class="num">3</div><div class="label">Bookings today</div></div>
    </div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div class="eyebrow" data-i18n="announcements">Announcements</div>
      <button class="btn-ghost tap" style="font-size:10.5px; padding:5px 10px;" data-i18n="addOwnerOnly">+ Add (owner only)</button>
    </div>
    <div class="title" style="font-size:15px; margin-top:4px;">New Canva schedule template uploaded</div>
    <div style="font-size:12.5px; color:var(--muted); margin-top:4px;">Posted by Gisel — use this for October's schedule graphic.</div>
  </div>
  <div class="card">
    <div class="eyebrow" data-i18n="upcomingBirthdays">Upcoming birthdays</div>
    <div style="font-size:13px; margin-top:6px;">🎂 Sarah T. — Mar 14</div>
    <div style="font-size:13px; margin-top:6px;">🎂 Bella K. — Sep 20</div>
  </div>
</div>`;

// ---------- CLIENTS ----------
const clients = [
  {name:'Sarah T.', birthday:'Mar 14', visits:5, last:'Aug 28', artist:'Nayla (senior)', pref:['chrome','minimalist'], rating:5, note:'Loves nude tones, always books 2hr slot, sensitive cuticles.', privateNote:'Written by Nayla — mentioned she\'s going through a rough divorce, prefers not to talk about work during her session.', sharedNote:'Prefers text reminders over calls.'},
  {name:'Bella K.', birthday:'Sep 20', visits:2, last:'Sep 02', artist:'Amanda (junior)', pref:['3D charms','bold color'], rating:4, note:'First-timer became regular. Asked about loyalty reward at visit 3.', privateNote:'Written by Amanda — new mom, might bring baby along, keep sessions under 90 min if possible.', sharedNote:'Birthday coming up Sep 20 — consider a small discount.'},
  {name:'Meidy R.', birthday:'Nov 02', visits:8, last:'Sep 05', artist:'Nayla (senior)', pref:['french tip','gel'], rating:5, note:'VIP — free add-on earned at visit 8. Always brings reference photos.', privateNote:'Written by Gisel — referred 3 friends, treat as VIP for scheduling priority.', sharedNote:'Always tips well, offer the new charm designs first.'}
];
function clientCardHtml(c){
  return `
  <div class="card">
    <div class="row">

      <div style="flex:1">
        <div style="font-family:'Fraunces',serif; font-weight:600; font-size:15.5px;">${c.name}</div>
        <div style="font-size:11.5px; color:var(--muted);">Last visit ${c.last} · with ${c.artist}</div>
      </div>
      <div class="tag">${c.visits} visits</div>
    </div>
    <div class="divider"></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
      ${c.pref.map(p => `<span class="tag">#${p}</span>`).join('')}
    </div>
    <div style="font-size:12.5px; color:var(--text); line-height:1.5;">${c.note}</div>
    <div class="row" style="margin-top:10px; justify-content:space-between;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent);">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)}</div>
      <button class="btn-ghost tap" style="font-size:11px; padding:6px 10px;">View visit history</button>
    </div>
    <div style="font-size:10.5px; color:var(--muted); margin-top:8px;">🎂 ${c.birthday} · visits logged only by owner/admin</div>
    <div class="divider"></div>
    ${(currentUser.role==='Owner' || c.privateNote.includes('by '+currentUser.name)) ? `
    <div class="row" style="justify-content:space-between; margin-bottom:6px;">
      <span style="font-size:11px; color:var(--muted);">🔒 Private note — visible to writer + owner only</span>
    </div>
    <div style="font-size:12px; color:var(--text); background:var(--tint); border-radius:10px; padding:8px 10px; margin-bottom:10px;">${c.privateNote}</div>` : ''}
    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">📌 Shared note — anyone on the team can add or see this</div>
    <div style="font-size:12px; color:var(--text); background:var(--surface); border:1px solid var(--hairline); border-radius:10px; padding:8px 10px;">${c.sharedNote}</div>
  </div>`;
}
pages.innerHTML += `
<div class="pagesec" id="page-clients">
  <div class="card">
    <div class="eyebrow" data-i18n="loggedInAs">Logged in as</div>
    <div style="font-size:13px; margin-top:4px;" id="loggedInAsLine"><b>Gisel</b> — Owner · sees every client automatically, no switching needed</div>
  </div>
  <div class="card">
    <div class="eyebrow" data-i18n="clientList">Client list</div>
    <div class="title" data-i18n="clientsVisits">Clients & visits</div>
    <div class="row" style="gap:6px; margin-top:10px;">
      <input id="clientSearch" data-i18n-ph="searchClientsPlaceholder" placeholder="Search name, style, notes..." style="flex:1;" />
      <button class="btn-primary tap" id="clientSearchBtn" data-i18n="search" style="padding:9px 16px;">Search</button>
    </div>
  </div>
  <div id="clientResults"></div>
  <div class="card">
    <div class="eyebrow" data-i18n="exampleSharedClient">Example — shared client</div>
    <div class="title" style="font-size:15.5px;">Meidy R. — visit history</div>
    <div class="divider"></div>
    <div style="font-size:12.5px; margin-bottom:8px;"><b>Sep 05</b> — Nayla (senior) — gel, french tip <span class="tag" style="margin-left:4px;">on calendar</span></div>
    <div style="font-size:12.5px; margin-bottom:8px;"><b>Jul 14</b> — Amanda (junior) — gel refill <span class="tag" style="margin-left:4px;">on calendar</span></div>
    <div style="font-size:12.5px;"><b>May 02</b> — Nayla (senior) — gel, chrome <span class="tag" style="margin-left:4px;">on calendar</span></div>
    <div style="font-size:11px; color:var(--muted); margin-top:8px;">Only the owner sees this combined view across artists — each artist's own page only shows the visits they personally handled.</div>
    <button class="btn-primary tap" style="width:100%; margin-top:10px;" data-i18n="addVisit">+ Add visit</button>
  </div>
</div>`;
const isOwnerOrAdmin = currentUser.role === 'Owner' || currentUser.role === 'Instagram admin';
document.getElementById('loggedInAsLine').innerHTML = isOwnerOrAdmin
  ? `<b>${currentUser.name}</b> — ${currentUser.role} · sees every client automatically, no switching needed`
  : `<b>${currentUser.name}</b> — ${currentUser.role} · only your own clients show here automatically`;
function renderClients(filter){
  const f = (filter||'').toLowerCase().trim();
  const scoped = isOwnerOrAdmin ? clients : clients.filter(c => c.artist.startsWith(currentUser.name));
  const results = scoped.filter(c => !f || (c.name+' '+c.pref.join(' ')+' '+c.note+' '+c.sharedNote+' '+c.artist).toLowerCase().includes(f));
  document.getElementById('clientResults').innerHTML = results.length ? results.map(clientCardHtml).join('') : `<div class="card"><div style="font-size:12.5px; color:var(--muted);">No clients match — try a different word.</div></div>`;
}
document.getElementById('clientSearch').oninput = e => renderClients(e.target.value);
document.getElementById('clientSearchBtn').onclick = () => renderClients(document.getElementById('clientSearch').value);
renderClients('');



// ---------- CALENDAR ----------
pages.innerHTML += `
<div class="pagesec section-hidden" id="page-calendar">
  <div class="card">
    <div class="eyebrow" data-i18n="thisWeek">This week</div>
    <div class="title" data-i18n="bookings">Bookings</div>
  </div>
  <div class="row" style="gap:8px; margin-bottom:4px;">
    <button class="pill active tap" id="calTeamBtn" style="flex:1; text-align:center;" data-i18n="teamCalendar">Group calendar</button>
    <button class="pill tap" id="calMineBtn" style="flex:1; text-align:center;" data-i18n="privateCalendar">Personal calendar</button>
  </div>
  <div class="card" style="padding:10px 12px;">
    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;" data-i18n="showScheduleFor">Show schedule for:</div>
    <select id="calWhoFilter" style="font-size:12.5px;">

      <option value="Amanda">Amanda — hers only</option>
      <option value="IG Admin">IG Admin — theirs only</option>
    </select>
  </div>
  <div class="card" style="background:linear-gradient(160deg, var(--tint) 0%, var(--surface) 140%);">
    <div class="row" style="justify-content:space-between; margin-bottom:10px;">
      <span class="tap" id="calPrev" style="cursor:pointer; color:var(--accent); font-size:18px; padding:4px 8px;">‹</span>
      <div id="calMonthLabel" style="font-family:'Fraunces',serif; font-size:16px; font-weight:600;">🗓️ September 2026</div>
      <span class="tap" id="calNext" style="cursor:pointer; color:var(--accent); font-size:18px; padding:4px 8px;">›</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); margin-bottom:6px;">
      <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
    </div>
    <div id="calGrid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px;"></div>
  </div>
  <div class="card" id="calDayCard"></div>
  <div class="card" id="calBusyCard"></div>
  <div class="card" id="calTeamOnlyNote">
    <div style="font-size:11.5px; color:var(--muted);">Group calendar: everyone can view, only owner and admin can add or edit. Personal calendar: private to each person, for their own reminders. Tap any date above to see or add to that day.</div>
  </div>
  <div class="card">
    <div style="font-weight:600; font-size:13px; margin-bottom:6px;" data-i18n="googleCalendarSync">Google Calendar sync</div>
    <div style="font-size:11.5px; color:var(--muted); background:var(--tint); border-radius:10px; padding:8px 10px;">⚠️ This only <b>reads</b> your Google Calendar. It never edits, deletes, or adds anything on your actual Google Calendar — nothing here can change it in any way.</div>
    <button class="btn-ghost tap" style="width:100%; margin-top:10px;" data-i18n="connectGoogleCalendar">Connect Google Calendar</button>
  </div>
</div>`;

// ---------- CALENDAR GRID ----------
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const CAL_BOOKINGS = {
  '2026-7-28': [{client:'Sarah T.', artist:'Nayla (senior)', time:'11:00 AM', service:'gel refill', status:'Confirmed', group:true, people:['Nayla']}],
  '2026-8-9':  [{client:'Sarah T.', artist:'Nayla (senior)', time:'1:00 PM', service:'chrome + minimalist', status:'Confirmed', group:true, people:['Nayla']}],
  '2026-8-10': [{client:'Bella K.', artist:'Amanda (junior)', time:'4:00 PM', service:'deposit pending', status:'Awaiting', group:true, people:['Amanda','IG Admin']}],
  '2026-8-14': [{client:'', artist:'Gisel', time:'All day', service:'Sarah T.\'s birthday reminder', status:'Personal', group:false, people:['Gisel']}],
  '2026-9-2':  [{client:'Meidy R.', artist:'Nayla (senior)', time:'10:00 AM', service:'french tip + gel', status:'Confirmed', group:true, people:['Nayla','Gisel']}]
};
let calMode = 'team';
let calWho = 'everyone';
let cursor = {year:2026, month:8}; // September = index 8
let selectedDay = 9;
function keyFor(d){ return `${cursor.year}-${cursor.month}-${d}`; }
function matchesFilter(b){
  const modeOk = calMode==='team' ? b.group : !b.group;
  const whoOk = calWho==='everyone' || (b.people && b.people.includes(calWho));
  return modeOk && whoOk;
}
function renderCalGrid(){
  document.getElementById('calMonthLabel').textContent = `🗓️ ${MONTH_NAMES[cursor.month]} ${cursor.year}`;
  const grid = document.getElementById('calGrid');
  const firstDow = new Date(cursor.year, cursor.month, 1).getDay();
  const daysInMonth = new Date(cursor.year, cursor.month+1, 0).getDate();
  let cells = '';
  for (let i=0;i<firstDow;i++) cells += `<div></div>`;

function renderBusyCard(){

  Object.entries(CAL_BOOKINGS).forEach(([k,items]) => {

  });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const el = document.getElementById('calBusyCard');

// ---------- PERMISSION MATRIX (Admin tab) ----------
const pwVisible = {};
function renderMatrix(){
  const el = document.getElementById('permMatrix');
  el.innerHTML = people.map((p, pi) => `
    <div style="padding:10px 0; border-top:1px solid var(--hairline);">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <div class="row"><div class="avatar" style="width:28px; height:28px; font-size:11px;">${p.name[0]}</div>
          <div><div style="font-size:13px; font-weight:600;">${p.name}${p.locked ? ' (you)' : ''}</div><div style="font-size:10px; color:var(--muted);">${p.role}</div></div></div>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; padding-left:38px; margin-bottom:8px;">
        ${PAGES_FOR_MATRIX.map(pg => `
          <button class="pill tap" data-person="${pi}" data-page="${pg}" style="font-size:10px; padding:4px 8px; ${p.locked ? 'opacity:.5; pointer-events:none;' : ''} ${p.access[pg]===2 ? 'background:var(--accent); color:#fff; border-color:var(--accent);' : p.access[pg]===1 ? 'background:var(--tint); color:var(--text);' : ''}">${pg}: ${LEVELS[p.access[pg]]}</button>
        `).join('')}
      </div>
      <div style="padding-left:38px; display:flex; gap:6px; align-items:center;">
        <input readonly value="${p.username}" style="font-size:11px; padding:6px 8px; flex:1;" />
        <input readonly type="${pwVisible[pi] ? 'text' : 'password'}" value="${p.password}" style="font-size:11px; padding:6px 8px; flex:1;" />
        <span class="tap" data-pwtoggle="${pi}" style="cursor:pointer; font-size:14px;">${pwVisible[pi] ? '🙈' : '👁️'}</span>
        <button class="btn-ghost tap" style="font-size:10px; padding:6px 8px;">Reset</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-person]').forEach(btn => {
    btn.onclick = () => {
      const pi = +btn.dataset.person, pg = btn.dataset.page;
      people[pi].access[pg] = (people[pi].access[pg] + 1) % 3;
      renderMatrix();
    };
  });
  el.querySelectorAll('[data-pwtoggle]').forEach(btn => {
    btn.onclick = () => {
      const pi = +btn.dataset.pwtoggle;
      pwVisible[pi] = !pwVisible[pi];
      renderMatrix();
    };
  });
}
renderMatrix();

function applyLang(){
  const dict = TRANSLATIONS[currentLang];
  document.querySelectorAll('.navbtn').forEach(b => {

    if (spans[1] && dict[key]) spans[1].textContent = dict[key];

    if (dict[key]) el.textContent = dict[key];

    if (dict[key]) el.placeholder = dict[key];
  });
