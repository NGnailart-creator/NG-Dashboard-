      <div style="font-size:10px; color:var(--muted); margin-top:2px;">${new Date(x.created_at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`).join('') : '<div style="font-size:12px; color:var(--muted); padding:10px 0;">No notifications yet.</div>'}
    ${NOTIFS.some(x => /^booking/.test(x.kind)) ? `<button class="btn-primary tap" data-gobook style="width:100%; margin-top:10px;">Open booking requests</button>` : ''}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', ev => { if (ev.target === ov || ev.target.closest('[data-close]')) ov.remove(); if (ev.target.closest('[data-gobook]')){ ov.remove(); showPage('calendar'); } });
  const unread = NOTIFS.filter(x => !x.read_at).map(x => x.id);
  if (unread.length){ await sb.from('ngd_notifications').update({ read_at: new Date().toISOString() }).in('id', unread); loadNotifs(); }
};

// booking settings (owner & admin, Website page)
if (document.getElementById('page-website')){
  document.getElementById('page-website').insertAdjacentHTML('beforeend', `<div class="card"><div class="eyebrow">Client website</div><div class="title">Booking settings</div>
    <div style="display:grid; gap:8px; margin-top:10px;">
      <label style="font-size:10.5px; color:var(--muted);">When can clients book a month?</label>
      <select id="bkOpenMode"><option value="auto">Automatic — each month opens on the last Tuesday of the month before</option><option value="manual">Manual — I choose the date myself</option></select>
      <div id="bkOpenAuto" class="row" style="gap:6px; align-items:center;"><span style="flex:2.6; font-size:11px; color:var(--muted);">Opens at (hour, Jakarta time)</span><input id="bkOpenHour" type="number" min="0" max="23" style="flex:1;" /></div>
      <div id="bkOpenManual" style="display:none;"><label style="font-size:10.5px; color:var(--muted);">Booking open until</label><input id="bkOpenUntil" type="date" /></div>
      <div id="bkOpenNow" style="font-size:11px; background:var(--tint); border-radius:10px; padding:8px 10px;"></div>
      <div class="row" style="gap:6px;"><div style="flex:1;"><label style="font-size:10.5px; color:var(--muted);">DP owner</label><input id="bkDpOwner" type="number" /></div><div style="flex:1;"><label style="font-size:10.5px; color:var(--muted);">DP senior</label><input id="bkDpSenior" type="number" /></div><div style="flex:1;"><label style="font-size:10.5px; color:var(--muted);">DP junior</label><input id="bkDpJunior" type="number" /></div></div>
      <div style="font-size:10.5px; color:var(--muted); margin-top:4px;">Usual sessions and working days per nail artist. Separate sessions with a comma; a slash means alternative start times in the same session, e.g. <b>08/09, 12/13, 16</b>. When one time in a session is booked, the others in that session close automatically.</div>
      <div id="bkArtistSlots"></div>
      ${isOwner ? `<div style="font-size:10.5px; color:var(--muted); margin-top:4px;">Google Calendar invite emails (only the owner can change these; never shown to clients)</div>
      <div id="bkCalEmails">${people.map(p => `<div class="row" style="gap:6px; align-items:center; margin-bottom:4px;"><span style="flex:1; font-size:11.5px;">${esc(p.name)}</span><input class="bkCalEmail" data-id="${p.id}" type="email" value="${esc(p.calEmail||'')}" placeholder="name@gmail.com" style="flex:2.6; font-size:12px; padding:7px 8px;" /></div>`).join('')}</div>` : ''}
      <div style="font-size:10.5px; color:var(--muted); margin-top:4px;">Per service: duration in minutes, and below it the price estimate in thousands (e.g. 175-225) shown to clients — columns Owner / Senior / Junior. Empty duration = not offered with that level.</div>
      <div id="bkSvcTable"></div>
      <button class="btn-primary tap" id="bkSetSave">Save booking settings</button>
    </div></div>`);
  (async () => {
    await loadBookCfg(); const c = BOOK_CFG || {};
    document.getElementById('bkOpenUntil').value = c.open_until || '';
    document.getElementById('bkOpenMode').value = c.open_mode || 'auto'; document.getElementById('bkOpenHour').value = c.open_hour ?? 0;
    const syncMode = async () => { const auto = document.getElementById('bkOpenMode').value === 'auto';
      document.getElementById('bkOpenAuto').style.display = auto ? '' : 'none'; document.getElementById('bkOpenManual').style.display = auto ? 'none' : '';
      const { data: w } = await sb.rpc('ngd_booking_window'); if (!w) return;
      document.getElementById('bkOpenNow').innerHTML = `Right now clients can book until <b>${dayLabel(w.open_until)}</b>.` + (w.next_open && auto ? ` Next month opens <b>${new Date(w.next_open).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</b>.` : ''); };
    document.getElementById('bkOpenMode').onchange = syncMode; syncMode();
    document.getElementById('bkArtistSlots').innerHTML = bookArtists().map(a => { const days = (c.artist_days||{})[a.id] || c.days || [2,3,4,5];
      return `<div style="margin-bottom:10px;"><div class="row" style="gap:6px; align-items:center;"><span style="flex:1; font-size:11.5px; font-weight:600;">${esc(a.name)}</span><input class="bkASlots" data-id="${a.id}" value="${esc(sessionsText((c.artist_sessions||{})[a.id] || ((c.artist_slots||{})[a.id] || c.slots || []).map(t => [t])))}" style="flex:2.6; font-size:12px; padding:7px 8px;" /></div>
        <div style="display:flex; gap:4px; margin-top:4px; justify-content:flex-end;">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((n,i) => `<label style="font-size:10px; display:flex; flex-direction:column; align-items:center; gap:2px;"><input type="checkbox" class="bkADay" data-id="${a.id}" value="${i+1}" ${days.includes(i+1)?'checked':''} style="width:auto;">${n}</label>`).join('')}</div>
        <label class="row" style="gap:6px; font-size:11px; margin-top:6px; justify-content:flex-end; align-items:center;"><input type="checkbox" class="bkAShow" data-id="${a.id}" ${(c.hidden_artists||[]).includes(a.id)?'':'checked'} style="width:auto;"> Show to clients for online booking</label></div>`; }).join('')
      + `<div class="row" style="gap:6px; align-items:center; margin-top:6px;"><span style="flex:2.6; font-size:11px; color:var(--muted);">Online booking closes the day before at (hour). Same-day & later → Instagram DM.</span><input id="bkCutoff" type="number" min="0" max="23" value="${c.cutoff_hour ?? 17}" style="flex:1; font-size:12px; padding:7px 8px;" /></div>`;
    document.getElementById('bkDpOwner').value = (c.dp||{}).owner || ''; document.getElementById('bkDpSenior').value = (c.dp||{}).senior || ''; document.getElementById('bkDpJunior').value = (c.dp||{}).junior || '';
    const G = {base:'Treatment', removal:'Removal (only with a treatment)', design:'Design (one per booking)', extra:'Extra'};
    let last = '';
    document.getElementById('bkSvcTable').innerHTML = (c.services||[]).map(s => { const head = s.group !== last ? `<div style="font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:10px 0 4px;">${G[s.group]||s.group}</div>` : ''; last = s.group;
      const pv = t => { const p = (s.price||{})[t]; return p ? (p[0] === p[1] ? p[0]/1000 : p[0]/1000 + '-' + p[1]/1000) : ''; };
      return head + `<div style="margin-bottom:8px;"><div class="row" style="gap:4px; align-items:center;"><span style="flex:2.4; font-size:11.5px;">${esc(s.en)}</span>${['owner','senior','junior'].map(t => `<input class="bkMin" data-key="${s.key}" data-tier="${t}" type="number" inputmode="numeric" value="${s.min[t] ?? ''}" placeholder="—" style="flex:1; font-size:12px; padding:7px 6px;" />`).join('')}</div>
        <div class="row" style="gap:4px; align-items:center; margin-top:3px;"><span style="flex:2.4; font-size:10px; color:var(--muted); text-align:right; padding-right:4px;">price (K)</span>${['owner','senior','junior'].map(t => `<input class="bkPrice" data-key="${s.key}" data-tier="${t}" value="${pv(t)}" placeholder="—" style="flex:1; font-size:11px; padding:6px;" />`).join('')}</div></div>`; }).join('');
  })();
  document.getElementById('bkSetSave').onclick = async () => {
    const c = JSON.parse(JSON.stringify(BOOK_CFG || {}));
    c.open_until = document.getElementById('bkOpenUntil').value || c.open_until;
    c.open_mode = document.getElementById('bkOpenMode').value; c.open_hour = Math.min(23, Math.max(0, parseInt(document.getElementById('bkOpenHour').value) || 0));
    c.dp = { owner: +document.getElementById('bkDpOwner').value || 0, senior: +document.getElementById('bkDpSenior').value || 0, junior: +document.getElementById('bkDpJunior').value || 0 };
    c.artist_days = c.artist_days || {};
    bookArtists().forEach(a => { c.artist_days[a.id] = [...document.querySelectorAll(`.bkADay[data-id="${a.id}"]:checked`)].map(x => +x.value); });
    c.hidden_artists = [...document.querySelectorAll('.bkAShow')].filter(x => !x.checked).map(x => x.dataset.id);
    c.hidden_tiers = ['owner','senior','junior'].filter(t => { const as = bookArtists().filter(a => ({'Owner':'owner','Senior artist':'senior','Junior artist':'junior'})[a.role] === t); return as.length && as.every(a => c.hidden_artists.includes(a.id)); });
    c.cutoff_hour = Math.min(23, Math.max(0, parseInt(document.getElementById('bkCutoff').value) || 17));
    c.artist_slots = c.artist_slots || {};
    c.artist_sessions = c.artist_sessions || {};
    for (const i of document.querySelectorAll('.bkASlots')){
      const sess = i.value.split(',').map(x => x.trim()).filter(Boolean).map(g => g.split('/').map(t => { const m = t.trim().replace('.',':').match(/^(\d{1,2})(?::(\d{2}))?$/); return m ? m[1].padStart(2,'0') + ':' + (m[2]||'00') : null; }));
      if (!sess.length || sess.some(g => g.some(x => !x))) return alert('Write sessions like: 08/09, 12/13, 16  (a slash = alternative start times in the same session)');
      c.artist_sessions[i.dataset.id] = sess.map(g => [...new Set(g)].sort());
      c.artist_slots[i.dataset.id] = [...new Set(sess.flat())].sort();
    }
    for (const i of document.querySelectorAll('.bkPrice')){
      const s = c.services.find(x => x.key === i.dataset.key); s.price = s.price || {};
      const v = i.value.trim().replace(/k/ig,''); if (!v){ s.price[i.dataset.tier] = null; continue; }
      const m = v.match(/^(\d+(?:[.,]\d+)?)\s*(?:-|–)?\s*(\d+(?:[.,]\d+)?)?$/); if (!m) return alert('Price must look like 110 or 175-225 (in thousands)');
      const lo = Math.round(parseFloat(m[1].replace(',','.'))*1000), hi = m[2] ? Math.round(parseFloat(m[2].replace(',','.'))*1000) : lo;
      s.price[i.dataset.tier] = [Math.min(lo,hi), Math.max(lo,hi)];
    }
    document.querySelectorAll('.bkMin').forEach(i => { const s = c.services.find(x => x.key === i.dataset.key); const v = i.value.trim(); s.min[i.dataset.tier] = v === '' ? null : Math.max(5, parseInt(v) || 0); });
    const { error } = await sb.from('ngd_site').upsert({ key:'booking', value:c, updated_by:currentUser.id, updated_at:new Date().toISOString() });
    if (error) return alert('Could not save: ' + error.message);
    BOOK_CFG = c;
    for (const i of document.querySelectorAll('.bkCalEmail')){ const p = people.find(x => x.id === i.dataset.id), v = i.value.trim();
      if (p && v !== (p.calEmail||'')){ const { error: e2 } = await sb.from('ngd_staff').update({ calendar_email: v || null }).eq('id', p.id); if (e2) return alert('Could not save email for ' + p.name + ': ' + e2.message); p.calEmail = v; } }
    alert('Saved — the client website uses these settings right away.');
  };
}

// ---- team profiles (owner/admin edit all, each person edits their own)
const ROLE_LABEL = { 'Owner':'Owner', 'Admin':'Admin', 'Senior artist':'Senior nail artist', 'Junior artist':'Junior nail artist' };
function renderTeam(){
  const el = document.getElementById('teamList'); if (!el) return;
  el.innerHTML = people.map(p => { const can = isOwnerOrAdmin || p.id === currentUser.id;
    const ph = p.photo ? sb.storage.from('ngd-team-photos').getPublicUrl(p.photo).data.publicUrl : null;
    return `<div class="card"><div class="row"><div class="avatar" style="overflow:hidden;">${ph ? `<img src="${ph}" style="width:100%; height:100%; object-fit:cover;">` : esc((p.name||'?')[0])}</div>
      <div style="flex:1"><div style="font-weight:600; font-size:14px;">${esc(p.name)}</div>
      <div style="font-size:11.5px; color:var(--muted);">${esc(p.title || ROLE_LABEL[p.role] || p.role)}</div></div>
      ${can ? `<button class="btn-ghost tap" data-teamedit="${p.id}" style="font-size:10.5px; padding:5px 10px;">Edit</button>` : ''}</div>
      <div id="teamBio-${p.id}" style="font-size:12px; color:${p.bio ? 'var(--text)' : 'var(--muted)'}; margin-top:8px; padding-left:50px; white-space:pre-wrap;">${p.bio ? esc(p.bio) : (can ? 'No description yet — tap Edit to add one.' : '')}</div></div>`; }).join('');
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-teamedit]'); if (b){ const p = people.find(x => x.id === b.dataset.teamedit);
    document.getElementById('teamBio-' + p.id).innerHTML = `<div style="display:grid; gap:6px;"><input id="tmTitle" value="${esc(p.title || ROLE_LABEL[p.role] || '')}" placeholder="Role line, e.g. Senior nail artist · Tue–Fri" />
      <textarea id="tmBio" style="min-height:70px;" placeholder="About (experience, specialties…)">${esc(p.bio||'')}</textarea>
      <button class="btn-ghost tap" data-teamphoto="${p.id}">📷 ${p.photo ? 'Change photo' : 'Add photo'}</button>
      <div class="row" style="gap:6px;"><button class="btn-ghost tap" data-teamcancel style="flex:1;">Cancel</button><button class="btn-primary tap" data-teamsave="${p.id}" style="flex:1;">Save</button></div></div>`; return; }
  const tp = e.target.closest('[data-teamphoto]'); if (tp){ const p = people.find(x => x.id === tp.dataset.teamphoto);
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => { const f = inp.files && inp.files[0]; if (!f) return;
      try {
        const url = URL.createObjectURL(f); const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
        const m = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas'); cv.width = cv.height = 400;
        const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,400,400); g.drawImage(img, (img.naturalWidth-m)/2, (img.naturalHeight-m)/2, m, m, 0, 0, 400, 400); URL.revokeObjectURL(url);
        const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85));
        const path = `${p.id}/${Date.now()}.jpg`, old = p.photo;
        const up = await sb.storage.from('ngd-team-photos').upload(path, blob, { contentType:'image/jpeg' }); if (up.error) throw up.error;
        const { error } = await sb.rpc('ngd_set_staff_photo', { p_id: p.id, p_path: path }); if (error) throw error;
        if (old) sb.storage.from('ngd-team-photos').remove([old]);
        p.photo = path; renderTeam();
      } catch(err){ alert('Could not upload: ' + (err.message || err)); } };
    inp.click(); return; }
  if (e.target.closest('[data-teamcancel]')) return renderTeam();
  const sv = e.target.closest('[data-teamsave]'); if (sv){ const p = people.find(x => x.id === sv.dataset.teamsave);
    const t = document.getElementById('tmTitle').value.trim(), bio = document.getElementById('tmBio').value.trim();
    const { error } = await sb.rpc('ngd_update_staff_profile', { p_id: p.id, p_title: t, p_bio: bio }); if (error) return alert(error.message);
    p.title = t; p.bio = bio; renderTeam(); }
});
renderTeam();

// ---- home: greeting, today's bookings, team announcements
function renderHome(){
  const id = currentLang === 'id', h = new Date().getHours();
  const greet = id ? (h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam') : (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening');
  document.getElementById('homeGreet').textContent = `${greet}, ${currentUser.name}`;
  document.getElementById('homeDate').textContent = new Date().toLocaleDateString(id ? 'id-ID' : 'en-GB', {weekday:'long', day:'numeric', month:'long'});
  const t = todayISO(), mine = a => isOwnerOrAdmin || a.artist_id === currentUser.id;
  const today = APPTS.filter(a => a.appt_date === t && mine(a) && ['confirmed','awaiting_approval','awaiting_dp'].includes(a.status)).sort((x,y) => x.start_min - y.start_min);
  const req = APPTS.filter(a => mine(a) && (a.status === 'awaiting_approval' || a.status === 'awaiting_dp')).length;
  document.getElementById('homeToday').textContent = today.length;
  document.getElementById('homeReq').textContent = req;
  document.getElementById('homeTodayLbl').textContent = id ? 'Booking hari ini' : 'Bookings today';
  document.getElementById('homeReqLbl').textContent = id ? 'Menunggu approve' : 'Waiting for approval';
  document.getElementById('homeTodayList').innerHTML = today.map(a => `<div style="border-top:1px solid var(--hairline); padding:7px 0; font-size:12px;"><b style="font-weight:600;">${minToHM(a.start_min)}</b> · ${esc(a.client_name||'—')}${isOwnerOrAdmin ? ` · <span style="color:var(--muted);">${esc(a.artist_name||'')}</span>` : ''}<div style="font-size:11px; color:var(--muted);">${esc(a.summary||'')}${a.status !== 'confirmed' ? ' · ' + BK_ST[a.status] : ''}</div></div>`).join('');
}
document.getElementById('homeReqBox').onclick = () => showPage('calendar');
async function loadAnnouncements(){
  const { data } = await sb.from('ngd_team_announcements').select('*').order('created_at', {ascending:false}).limit(5);
  const el = document.getElementById('annList');
  el.innerHTML = (data||[]).length ? data.map(a => `<div style="border-top:1px solid var(--hairline); padding:8px 0;">
    <div class="row" style="justify-content:space-between; align-items:flex-start;"><div class="title" style="font-size:14px;">${esc(a.title)}</div>${isOwner ? `<span class="tap" data-anndel="${a.id}" style="cursor:pointer; color:var(--muted); font-size:12px;">✕</span>` : ''}</div>
    ${a.body ? `<div style="font-size:12.5px; color:var(--muted); margin-top:3px; white-space:pre-wrap;">${esc(a.body)}</div>` : ''}
    <div style="font-size:10px; color:var(--muted); margin-top:3px;">${esc(a.created_by_name||'')} · ${new Date(a.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div></div>`).join('')
    : `<div style="font-size:12px; color:var(--muted);">${currentLang === 'id' ? 'Belum ada pengumuman.' : 'No announcements yet.'}</div>`;
}
if (isOwner) document.getElementById('annAddBtn').style.display = '';
document.getElementById('annAddBtn').onclick = async () => {
  const title = prompt('Announcement title (for the team):'); if (!title || !title.trim()) return;
  const body = prompt('Details (optional):') || '';
  const { error } = await sb.from('ngd_team_announcements').insert({ title: title.trim(), body: body.trim() || null, created_by: currentUser.id, created_by_name: currentUser.name });
  if (error) return alert(error.message); loadAnnouncements();
};
document.addEventListener('click', async e => { const d = e.target.closest('[data-anndel]'); if (!d) return;
  if (!confirm('Delete this announcement?')) return; const { error } = await sb.from('ngd_team_announcements').delete().eq('id', d.dataset.anndel); if (error) return alert(error.message); loadAnnouncements(); });
document.getElementById('langToggle').addEventListener('click', () => { renderHome(); loadAnnouncements(); });
loadAnnouncements();
loadBookCfg(); loadAppts().then(renderHome); renderHome(); renderBkDay(); loadNotifs();
setInterval(() => { loadNotifs(); loadAppts(); reloadCal(); if (!BK_EDIT) renderBkMonth(); }, 60000);
document.addEventListener('click', async e => { const bf = e.target.closest('[data-bookfor]'); if (!bf) return;
  showPage('calendar'); if (!BOOK_CFG) await loadBookCfg();
  document.getElementById('bkAddForm').innerHTML = bookAddFormHtml();
  const sel = document.getElementById('bkfClient'); if (sel) sel.value = bf.dataset.bookfor;
  document.getElementById('bkAddForm').scrollIntoView({ behavior:'smooth', block:'center' }); });

document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
document.getElementById('changePwBtn').onclick = async () => {
  const pw = prompt('New password (min. 6 characters):');
  if (!pw) return;
  if (pw.length < 6){ alert('Password must be at least 6 characters.'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  alert(error ? 'Could not change password: ' + error.message : 'Password changed.');
};

} // end initApp()
