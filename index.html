<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>NG Nail Art Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  html,body{height:100%;margin:0;}
  ::-webkit-scrollbar{display:none;}
  body{
    --bg:#FCEEF3; --surface:#FFFFFF; --text:#2A1620; --muted:#8C6B78;
    --accent:#D9527A; --onAccent:#FFFFFF; --tint:#FBDCE5; --hairline:#F2C9D6;
    background:var(--bg); font-family:Inter,sans-serif; color:var(--text);
  }
  .tap{transition:transform .12s ease, opacity .12s ease;}
  .tap:active{transform:scale(.96); opacity:.85;}
  .card{background:var(--surface); border-radius:16px; padding:16px; box-shadow:0 1px 2px rgba(42,22,32,0.06); margin-bottom:12px;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.02em;}
  .title{font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--text); margin-top:2px;}
  .pill{padding:6px 12px; border-radius:999px; font-family:Inter,sans-serif; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid var(--hairline); background:transparent; color:var(--text);}
  .pill.active{background:var(--accent); color:var(--onAccent); border-color:var(--accent);}
  .stat{flex:1; text-align:center; background:var(--tint); border-radius:12px; padding:10px 6px;}
  .stat .num{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:var(--accent);}
  .stat .label{font-family:Inter,sans-serif; font-size:10px; color:var(--muted); margin-top:2px;}
  .toggle{width:38px; height:22px; border-radius:999px; background:var(--hairline); position:relative; cursor:pointer; flex-shrink:0;}
  .toggle.on{background:var(--accent);}
  .toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s ease;}
  .toggle.on .knob{left:18px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 9px; border-radius:999px; background:var(--tint); color:var(--accent);}
  .topnav{position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--hairline); padding:10px 16px; display:flex; gap:6px; overflow-x:auto;}
  .navbtn{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 10px; border-radius:12px; font-family:Inter,sans-serif; font-size:10px; color:var(--muted); background:none; border:none; cursor:pointer; white-space:nowrap;}
  .navbtn.active{color:var(--accent); background:var(--tint);}
  .page{max-width:420px; margin:0 auto; padding:12px 16px 40px;}
  .section-hidden{display:none;}
  .avatar{width:40px; height:40px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:15px; flex-shrink:0;}
  .row{display:flex; align-items:center; gap:10px;}
  .btn-primary{background:var(--accent); color:var(--onAccent); border:none; border-radius:10px; padding:9px 14px; font-family:Inter,sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;}
  .btn-ghost{background:transparent; border:1px solid var(--hairline); border-radius:10px; padding:9px 14px; font-family:Inter,sans-serif; font-weight:600; font-size:12.5px; cursor:pointer; color:var(--text);}
  .themeRow{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.active{border-color:var(--text);}
  input,textarea,select{width:100%; font-family:Inter,sans-serif; font-size:13px; padding:9px 11px; border-radius:10px; border:1px solid var(--hairline); background:var(--surface); color:var(--text);}
  .divider{height:1px; background:var(--hairline); margin:10px 0;}
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .loginCard{max-width:340px; width:100%; background:var(--surface); border-radius:20px; padding:28px 22px; box-shadow:0 4px 16px rgba(42,22,32,0.1);}
  .pwWrap{position:relative;}
  .pwWrap .eye{position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:15px;}
</style>
</head>

<div id="loginScreen">

const SUPABASE_URL = 'https://avetybynptepfqmxedfj.supabase.co';

document.getElementById('loginPwToggle').onclick = () => {
  const pw = document.getElementById('loginPass');

document.getElementById('loginBtn').onclick = attemptLogin;

const STAFF_EMAIL = u => `${u.toLowerCase()}@team.ng-nailart.example`;
function showLoginError(msg){ const el=document.getElementById('loginError'); el.textContent=msg; el.style.display='block'; }
async function enterApp(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return false;
  const { data: staffRows, error } = await sb.from('ngd_staff').select('id,name,role,username,access,user_id').order('created_at');
  if (error || !staffRows){ showLoginError('Could not load your account. Try again.'); return false; }
  people = staffRows.map(r => ({ id:r.id, name:r.name, role:r.role, locked:r.role==='Owner', username:r.username, access:r.access||{}, user_id:r.user_id }));
  const me = people.find(p => p.user_id === user.id);
  if (!me){ await sb.auth.signOut(); showLoginError('This account is not part of the team.'); return false; }
  currentUser = me;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  initApp();
  return true;
}
async function attemptLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) return;
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Logging in...';
  const { error } = await sb.auth.signInWithPassword({ email: STAFF_EMAIL(u), password: p });
  btn.textContent = 'Log in';
  if (error){
    showLoginError(/fetch|network/i.test(error.message) ? 'Could not reach the database. Check your connection and try again.' : 'Username or password not recognized.');
    return;
  }
  await enterApp();
}
// stay logged in on this device
sb.auth.getSession().then(({ data }) => { if (data.session) enterApp(); });

function initApp(){

const THEMES = {
  pink:   {bg:'#FCEEF3', tint:'#FBDCE5', hairline:'#F2C9D6', accent:'#D9527A', text:'#2A1620', muted:'#8C6B78'},

  blue:   {bg:'#EDF6FB', tint:'#D6ECF5', hairline:'#C3DFEC', accent:'#2E7FA6', text:'#111E29', muted:'#66808F'},
  green:  {bg:'#EEF7EE', tint:'#DAEEDA', hairline:'#C7E2C7', accent:'#3E8C5C', text:'#14211A', muted:'#6B8C77'},
  purple: {bg:'#F4EEFB', tint:'#E7DAF6', hairline:'#DCC9EF', accent:'#8C5CC7', text:'#201A2B', muted:'#7C6E90'},
  red:    {bg:'#FCEEEE', tint:'#F8D9D9', hairline:'#F0C3C3', accent:'#C74A3E', text:'#2A1414', muted:'#8C6E6E'}
};
function applyTheme(name){
  const th = THEMES[name];
  Object.entries({'--bg':th.bg,'--tint':th.tint,'--hairline':th.hairline,'--accent':th.accent,'--text':th.text,'--muted':th.muted})
    .forEach(([k,v]) => document.body.style.setProperty(k,v));
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.theme===name));
}

const TABS = [
  {key:'home', label:'Home', icon:'🏠'},
  {key:'clients', label:'Clients', icon:'💅'},
  {key:'calendar', label:'Bookings', icon:'📅'},
  {key:'knowledge', label:'Knowledge', icon:'📚'},
  {key:'chitchat', label:'Chit-chat', icon:'💬'},
  {key:'team', label:'Team', icon:'👥'},
  {key:'pricing', label:'Pricing', icon:'💰', roles:['Owner','Admin']},
  {key:'admin', label:'Admin', icon:'🛡️', roles:['Owner']}
];
const visibleTabs = TABS.filter(tb => !tb.roles || tb.roles.includes(currentUser.role));

const nav = document.getElementById('topnav');
visibleTabs.forEach(tb => {
  const b = document.createElement('button');
  b.className = 'navbtn tap' + (tb.key==='home' ? ' active' : '');
  b.dataset.key = tb.key;
  b.innerHTML = `<span style="font-size:15px">${tb.icon}</span><span>${tb.label}</span>`;
  b.onclick = () => showPage(tb.key);
  nav.appendChild(b);
});

function showPage(key){
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.key===key));
  document.querySelectorAll('.pagesec').forEach(p => p.classList.toggle('section-hidden', p.id !== 'page-'+key));
}

const pages = document.getElementById('pages');

// ---------- HOME ----------
pages.innerHTML += `

  </div>

// ---------- CLIENTS ----------
let clients = []; // loaded from ngd_clients
function mapClientRow(r){
  return { id:r.id, name:r.name, birthday:r.birthday||'—', visits:r.visits||0, last:r.last_visit||'—', artist:r.artist||'—',
    pref:r.pref||[], rating:r.rating||5, note:r.note||'', privateNote:r.private_note ? `Written by ${r.private_note_author}: ${r.private_note}` : 'No private note yet.',
    sharedNote:r.shared_note || 'No shared note yet.' };
}
function clientCardHtml(c){
  return `
  <div class="card">
    <div class="row">
      <div class="avatar">${c.name[0]}</div>
      <div style="flex:1">
        <div style="font-family:'Fraunces',serif; font-weight:600; font-size:15.5px;">${c.name}</div>
        <div style="font-size:11.5px; color:var(--muted);">Last visit ${c.last} · with ${c.artist}</div>
      </div>
      <div class="tag">${c.visits} visits</div>
    </div>
    <div class="divider"></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
      ${c.pref.map(p => `<span class="tag">#${p}</span>`).join('')}
    </div>
    <div style="font-size:12.5px; color:var(--text); line-height:1.5;">${c.note}</div>
    <div class="row" style="margin-top:10px; justify-content:space-between;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent);">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)}</div>
      <button class="btn-ghost tap" style="font-size:11px; padding:6px 10px;">View visit history</button>
    </div>
    <div style="font-size:10.5px; color:var(--muted); margin-top:8px;">🎂 ${c.birthday} · visits logged only by owner/admin</div>
    <div class="divider"></div>
    ${(currentUser.role==='Owner' || c.privateNote.includes('by '+currentUser.name)) ? `
    <div class="row" style="justify-content:space-between; margin-bottom:6px;">
      <span style="font-size:11px; color:var(--muted);">🔒 Private note — visible to writer + owner only</span>
    </div>
    <div style="font-size:12px; color:var(--text); background:var(--tint); border-radius:10px; padding:8px 10px; margin-bottom:10px;">${c.privateNote}</div>` : ''}
    <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">📌 Shared note — anyone on the team can add or see this</div>
    <div style="font-size:12px; color:var(--text); background:var(--surface); border:1px solid var(--hairline); border-radius:10px; padding:8px 10px;">${c.sharedNote}</div>
  </div>`;
}
pages.innerHTML += `
<div class="pagesec" id="page-clients">
  <div class="card">
    <div class="eyebrow" data-i18n="loggedInAs">Logged in as</div>
    <div style="font-size:13px; margin-top:4px;" id="loggedInAsLine"><b>Gisel</b> — Owner · sees every client automatically, no switching needed</div>
  </div>
  <div class="card">
    <div class="eyebrow" data-i18n="clientList">Client list</div>
    <div class="title" data-i18n="clientsVisits">Clients & visits</div>
    <div class="row" style="gap:6px; margin-top:10px;">
      <input id="clientSearch" data-i18n-ph="searchClientsPlaceholder" placeholder="Search name, style, notes..." style="flex:1;" />
      <button class="btn-primary tap" id="clientSearchBtn" data-i18n="search" style="padding:9px 16px;">Search</button>
    </div>
  </div>
  <div id="clientResults"></div>
  <div class="card">
    <button class="btn-primary tap" id="addClientBtn" style="width:100%;">+ Add client</button>
    <div id="addClientForm"></div>
  </div>
</div>`;
const isOwnerOrAdmin = currentUser.role === 'Owner' || currentUser.role === 'Admin';
document.getElementById('loggedInAsLine').innerHTML = isOwnerOrAdmin
  ? `<b>${currentUser.name}</b> — ${currentUser.role} · sees every client automatically, no switching needed`
  : `<b>${currentUser.name}</b> — ${currentUser.role} · only your own clients show here automatically`;
function renderClients(filter){
  const f = (filter||'').toLowerCase().trim();
  const scoped = isOwnerOrAdmin ? clients : clients.filter(c => c.artist.startsWith(currentUser.name));
  const results = scoped.filter(c => !f || (c.name+' '+c.pref.join(' ')+' '+c.note+' '+c.sharedNote+' '+c.artist).toLowerCase().includes(f));
  document.getElementById('clientResults').innerHTML = results.length ? results.map(clientCardHtml).join('') : `<div class="card"><div style="font-size:12.5px; color:var(--muted);">No clients yet — add your first one below.</div></div>`;
}
document.getElementById('clientSearch').oninput = e => renderClients(e.target.value);
document.getElementById('clientSearchBtn').onclick = () => renderClients(document.getElementById('clientSearch').value);
document.getElementById('addClientBtn').onclick = () => {
  document.getElementById('addClientForm').innerHTML = `
    <div class="divider"></div>
    <div style="display:grid; gap:8px;">
      <input id="newClientName" placeholder="Client name" />
      <input id="newClientBirthday" placeholder="Birthday (e.g. Mar 14)" />
      <input id="newClientArtist" placeholder="Nail artist (e.g. Nayla (senior))" value="${currentUser.role==='Owner'||currentUser.role==='Admin' ? '' : currentUser.name}" />
      <input id="newClientPref" placeholder="Style preferences, comma separated" />
      <textarea id="newClientNote" placeholder="Notes" style="min-height:50px;"></textarea>
      <button class="btn-primary tap" id="saveNewClientBtn" style="width:100%;">Save client</button>
    </div>`;
  document.getElementById('saveNewClientBtn').onclick = async () => {
    const name = document.getElementById('newClientName').value.trim();
    if (!name) return;
    const payload = {
      name,
      birthday: document.getElementById('newClientBirthday').value.trim(),
      artist: document.getElementById('newClientArtist').value.trim(),
      pref: document.getElementById('newClientPref').value.split(',').map(s=>s.trim()).filter(Boolean),
      rating: 5, note: document.getElementById('newClientNote').value.trim(),
      private_note: '', private_note_author: '', shared_note: '', visits: 0, last_visit: ''
    };
    const { data, error } = await sb.from('ngd_clients').insert(payload).select().single();
    if (error){ alert('Could not save client: ' + error.message); return; }
    clients.push(mapClientRow(data));
    document.getElementById('addClientForm').innerHTML = '';
    renderClients(document.getElementById('clientSearch').value);
  };
};

// ---------- CALENDAR GRID ----------
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let CAL_BOOKINGS = {}; // loaded from ngd_bookings
const _today = new Date();
let calMode = 'team';
let calWho = 'everyone';
let cursor = {year:_today.getFullYear(), month:_today.getMonth()};
let selectedDay = _today.getDate();
function keyFor(d){ return `${cursor.year}-${cursor.month}-${d}`; }
function matchesFilter(b){
  const modeOk = calMode==='team' ? b.group : !b.group;
  const whoOk = calWho==='everyone' || (b.people && b.people.includes(calWho));
  return modeOk && whoOk;
}
function renderCalGrid(){
  document.getElementById('calMonthLabel').textContent = `🗓️ ${MONTH_NAMES[cursor.month]} ${cursor.year}`;
  const grid = document.getElementById('calGrid');
  const firstDow = new Date(cursor.year, cursor.month, 1).getDay();
  const daysInMonth = new Date(cursor.year, cursor.month+1, 0).getDate();
  let cells = '';
  for (let i=0;i<firstDow;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const has = (CAL_BOOKINGS[keyFor(d)]||[]).some(matchesFilter);
    const isSelected = d===selectedDay;
    cells += `<div class="tap calday" data-day="${d}" style="aspect-ratio:1; min-height:34px; display:flex; align-items:center; justify-content:center; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:11px; cursor:pointer; ${isSelected?'background:var(--accent); color:#fff;':has?'background:var(--tint); color:var(--text);':'color:var(--text);'}">${d}</div>`;
  }
  grid.innerHTML = cells;
}
function showCalDay(){
  const items = (CAL_BOOKINGS[keyFor(selectedDay)]||[]).filter(matchesFilter);
  const card = document.getElementById('calDayCard');
  const monthShort = MONTH_NAMES[cursor.month].slice(0,3);
  const addLabel = calMode==='team' ? '+ Add booking' : '+ Add personal note';
  if (!items.length){
    card.innerHTML = `<div style="font-size:12.5px; color:var(--muted);">${monthShort} ${selectedDay} — nothing on the ${calMode==='team'?'group':'personal'} calendar yet.</div>` +
      `<button class="btn-primary tap" id="calAddBtn" style="width:100%; margin-top:10px;">${addLabel}</button>`;
    renderBusyCard();
    return;
  }
    card.innerHTML = `<div class="eyebrow">${monthShort} ${selectedDay}</div>` + items.map((b,i) => `
      <div class="caldayitem" data-item="${i}" style="padding:8px 0; border-top:1px solid var(--hairline);">
        <div class="row" style="justify-content:space-between;">
          <div class="tap" data-goclient="1" style="font-weight:600; font-size:13px; cursor:pointer;">${b.client ? b.client + ' — ' : ''}${b.artist}</div>
          <div class="row" style="gap:6px;">
            <span class="tag">${b.status}</span>
            <span class="tap" data-tagpeople="${i}" style="cursor:pointer; font-size:13px;" title="Tag people">🏷️</span>
            <span class="tap" data-remove="${i}" style="cursor:pointer; font-size:13px; color:var(--muted);" title="Remove">✕</span>
          </div>
        </div>
        <div style="font-size:11.5px; color:var(--muted); margin-top:2px;">${b.time} — ${b.service}</div>
        ${b.people && b.people.length ? `<div style="display:flex; gap:5px; flex-wrap:wrap; margin-top:5px;">${b.people.map(p=>`<span class="tag">👤 ${p}</span>`).join('')}</div>` : ''}
        ${b.client ? `<div style="font-size:10px; color:var(--accent); margin-top:4px;">↳ tap the name to view ${b.client}'s client record — visit logged automatically</div>` : ''}
      </div>`).join('') +
      `<button class="btn-primary tap" id="calAddBtn" style="width:100%; margin-top:10px;">${addLabel}</button>`;
  renderBusyCard();
}
function renderBusyCard(){
  const counts = {};
  Object.entries(CAL_BOOKINGS).forEach(([k,items]) => {
    const [y,m,d] = k.split('-').map(Number);
    if (y===cursor.year && m===cursor.month) counts[d] = items.filter(b=>b.group).length;
  });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const el = document.getElementById('calBusyCard');
  if (!entries.length){ el.innerHTML = `<div style="font-size:11.5px; color:var(--muted);">No bookings logged yet this month to compare.</div>`; return; }
  el.innerHTML = `<div style="font-weight:600; font-size:12.5px; margin-bottom:8px;">Busiest days this month</div>` +
    entries.map(([d,c]) => `<div class="row" style="justify-content:space-between; padding:4px 0;"><span style="font-size:12px;">${MONTH_NAMES[cursor.month].slice(0,3)} ${d}</span><span class="tag">${c} booking${c>1?'s':''}</span></div>`).join('');
}
function goPrevMonth(){ cursor.month--; if (cursor.month<0){cursor.month=11; cursor.year--;} selectedDay=1; renderCalGrid(); showCalDay(); }
function goNextMonth(){ cursor.month++; if (cursor.month>11){cursor.month=0; cursor.year++;} selectedDay=1; renderCalGrid(); showCalDay(); }
function setCalMode(mode){
  calMode = mode;
  document.getElementById('calTeamBtn').classList.toggle('active', mode==='team');
  document.getElementById('calMineBtn').classList.toggle('active', mode==='mine');
  renderCalGrid(); showCalDay();
}
// single delegated listener — avoids re-binding handlers after every redraw
document.addEventListener('click', e => {
  if (e.target.closest('#calPrev')) return goPrevMonth();
  if (e.target.closest('#calNext')) return goNextMonth();

        <button class="btn-primary tap" id="calSaveBtn" style="width:100%;">Save to calendar</button>

  }
  if (e.target.closest('#calSaveBtn')) {

      const clientName = clientSel ? clientSel.value : '';
      const pickedPeople = [...document.querySelectorAll('[data-pickperson].active')].map(el=>el.dataset.pickperson);

      const service = document.getElementById('calFormService').value.trim();
      const dateStr = `${cursor.year}-${String(cursor.month+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;

        client_name: clientName, artist: currentUser.name, people: pickedPeople.length?pickedPeople:[currentUser.name],
        booking_date: dateStr, booking_time: time, service, status: 'Confirmed', is_group: isTeam
      };
      const { data, error } = await sb.from('ngd_bookings').insert(payload).select().single();
      if (error){ alert('Could not save: ' + error.message); return; }
      const key = keyFor(selectedDay);
      if (!CAL_BOOKINGS[key]) CAL_BOOKINGS[key] = [];
      CAL_BOOKINGS[key].push({ id:data.id, client:clientName, artist:currentUser.name, time, service, status:'Confirmed', group:isTeam, people:payload.people });
      renderCalGrid(); showCalDay();
    })();
    return;
  }
});

function buildPricingFromRows(rows){
  const out = {owner:{label:'Owner',sections:[]}, nayla:{label:'Nayla (senior)',sections:[]}, fida:{label:'Fida (junior)',sections:[]}};
  rows.forEach(r => {

}

function renderMonthlySummary(){
  const now = new Date();
  const summary = {};
  Object.entries(CAL_BOOKINGS).forEach(([key, items]) => {
    const [y,m] = key.split('-').map(Number);
    if (y !== now.getFullYear() || m !== now.getMonth()) return;
    items.forEach(b => {
      if (!b.group) return;
      const name = b.artist;
      if (!summary[name]) summary[name] = {clients:0, hand:0, feet:0, pressOn:0};
      summary[name].clients++;
      const s = (b.service||'').toLowerCase();
      if (s.includes('feet') || s.includes('pedicure') || s.includes('callus')) summary[name].feet++;
      else if (s.includes('press')) summary[name].pressOn++;
      else summary[name].hand++;
    });
  });
  const entries = Object.entries(summary);
  document.getElementById('monthlySummary').innerHTML = entries.length ? entries.map(([name,s]) => `
    <div style="padding:8px 0; border-top:1px solid var(--hairline);">
      <div class="row" style="justify-content:space-between; margin-bottom:6px;">
        <span style="font-weight:600; font-size:13px;">${name}</span>
        <span class="tag">${s.clients} bookings</span>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <span class="tag">💅 Hand: ${s.hand}</span>
        <span class="tag">🦶 Feet/callus: ${s.feet}</span>
        <span class="tag">✨ Press-on: ${s.pressOn}</span>
      </div>
    </div>`).join('') : `<div style="font-size:12px; color:var(--muted);">No bookings logged yet this month.</div>`;
}

function renderMatrix(){
  const el = document.getElementById('permMatrix');
  el.innerHTML = people.map((p, pi) => `

      <div class="row" style="justify-content:space-between; margin-bottom:8px;">

      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; padding-left:38px; margin-bottom:8px;">
        ${PAGES_FOR_MATRIX.map(pg => `
          <button class="pill tap" data-person="${pi}" data-page="${pg}" style="font-size:10px; padding:4px 8px; ${p.locked ? 'opacity:.5; pointer-events:none;' : ''} ${p.access[pg]===2 ? 'background:var(--accent); color:#fff; border-color:var(--accent);' : p.access[pg]===1 ? 'background:var(--tint); color:var(--text);' : ''}">${pg}: ${LEVELS[p.access[pg]]}</button>
        `).join('')}
      </div>
      <div style="padding-left:38px; display:flex; gap:6px; align-items:center;">
        <input readonly value="${p.username}" style="font-size:11px; padding:6px 8px; flex:1;" />
        <button class="btn-ghost tap" data-resetpw="${pi}" style="font-size:10px; padding:6px 8px;">Reset password</button>
        ${p.locked ? '' : `<button class="btn-ghost tap" data-delperson="${pi}" style="font-size:10px; padding:6px 8px;">Remove</button>`}
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-person]').forEach(btn => {
    btn.onclick = async () => {
      const pi = +btn.dataset.person, pg = btn.dataset.page;
      people[pi].access[pg] = (people[pi].access[pg] + 1) % 3;
      renderMatrix();
      await sb.from('ngd_staff').update({access: people[pi].access}).eq('id', people[pi].id);
    };
  });
  el.querySelectorAll('[data-resetpw]').forEach(btn => {
    btn.onclick = async () => {
      const p = people[+btn.dataset.resetpw];
      const newPw = prompt(`New temporary password for ${p.name} (min. 8 characters):`);
      if (!newPw) return;
      const { error } = await sb.rpc('ngd_reset_staff_password', { p_staff_id: p.id, p_password: newPw });
      alert(error ? 'Could not reset: ' + error.message : `Done. Give ${p.name} this password: ${newPw}\nThey can change it later with the 🔑 Password button.`);
    };
  });
  el.querySelectorAll('[data-delperson]').forEach(btn => {
    btn.onclick = async () => {
      const pi = +btn.dataset.delperson, p = people[pi];
      if (!confirm(`Remove ${p.name} from the team? Their login will stop working.`)) return;
      const { error } = await sb.rpc('ngd_delete_staff', { p_staff_id: p.id });
      if (error){ alert('Could not remove: ' + error.message); return; }
      people.splice(pi, 1); renderMatrix();
    };
  });
}

// ---------- LOAD ALL LIVE DATA FROM SUPABASE ----------
(async function loadAllData(){
  const [clientsRes, bookingsRes, kbRes, guidanceRes, chitRes, pricingRes, vouchersRes] = await Promise.all([
    sb.from('ngd_clients').select('*').order('created_at'),
    sb.from('ngd_bookings').select('*').order('booking_date'),
    sb.from('ngd_kb_items').select('*').order('created_at'),
    sb.from('ngd_guidance').select('*').order('created_at'),
    sb.from('ngd_chitchat').select('*').order('created_at', {ascending:false}).limit(50),
    sb.from('ngd_pricing').select('*').order('sort_order'),
    sb.from('ngd_vouchers').select('*').order('created_at')
  ]);

  clients = (clientsRes.data||[]).map(mapClientRow);
  renderClients('');

  CAL_BOOKINGS = {};
  (bookingsRes.data||[]).forEach(b => {
    const d = new Date(b.booking_date + 'T00:00:00');
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!CAL_BOOKINGS[key]) CAL_BOOKINGS[key] = [];
    CAL_BOOKINGS[key].push({ id:b.id, client:b.client_name, artist:b.artist, time:b.booking_time, service:b.service, status:b.status, group:b.is_group, people:b.people||[] });
  });
  renderCalGrid(); showCalDay();

  KB_ITEMS = (kbRes.data||[]).map(r => ({id:r.id, q:r.question, a:r.answer, tags:r.tags||[]}));
  renderTagIndex(); renderKB('');

  GUIDANCE_ITEMS = (guidanceRes.data||[]).map(r => ({id:r.id, title:r.title, content:r.content}));
  renderGuidance();

  CHITCHAT_POSTS = chitRes.data || [];
  renderChitchat();

  PRICING = buildPricingFromRows(pricingRes.data||[]);
  renderPriceSheet('owner');

  VOUCHERS = vouchersRes.data || [];
  renderVouchers();

  renderMonthlySummary();

  const bdayEl = document.getElementById('homeBirthdays');
  if (bdayEl){
    const withBday = clients.filter(c => c.birthday && c.birthday !== '—');
    bdayEl.innerHTML = withBday.length ? withBday.map(c => `🎂 ${c.name} — ${c.birthday}`).join('<br>') : 'No client birthdays saved yet.';
  }
})();
